server {
    listen 80;
    server_name _;

    # CRITICAL: Treasury must return 200 directly. NO REDIRECTS.
    location = /api/health {
        default_type application/json;
        return 200 '{"service":"treasury","status":"healthy","timestamp":"${date_iso_8601}"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}