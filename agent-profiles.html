<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge AI OS - Agent Profiles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00ff88;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.2em;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .agent-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
        }

        .agent-card.online {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .agent-card.offline {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .agent-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .agent-avatar {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin-right: 20px;
            border: 2px solid #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .agent-info h3 {
            font-size: 1.4em;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .agent-role {
            color: #0099ff;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge {
            margin-left: auto;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.online {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .status-badge.offline {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .agent-svg {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .agent-svg svg {
            width: 100%;
            height: 100%;
        }

        .agent-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            color: #a0a0a0;
            font-size: 0.8em;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .detail-value {
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9em;
        }

        .twin-connection {
            background: rgba(0, 153, 255, 0.1);
            border: 1px solid rgba(0, 153, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .twin-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .twin-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            color: #0099ff;
        }

        .twin-status {
            color: #0099ff;
            font-weight: bold;
            font-size: 0.9em;
        }

        .twin-metrics {
            display: flex;
            gap: 15px;
            font-size: 0.8em;
        }

        .twin-metric {
            color: #a0a0a0;
        }

        .twin-metric strong {
            color: #0099ff;
        }

        .agent-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: linear-gradient(135deg, #00ff88, #0099ff);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #666, #999);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #ff4444, #ff6b6b);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #a0a0a0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
        }

        .filter-btn:hover {
            border-color: #0099ff;
            color: #0099ff;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00ff88;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.95);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #00ff88;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: #00ff88;
            font-size: 1.5em;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 1.5em;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .agents-grid {
                grid-template-columns: 1fr;
            }

            .agent-details {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent Profiles</h1>
            <p>Explore AI agents with SVG visualizations linked to the Bridge AI OS twin system</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Agents</button>
            <button class="filter-btn" data-filter="online">Online Only</button>
            <button class="filter-btn" data-filter="offline">Offline Only</button>
            <button class="filter-btn" data-filter="core">Core Agents</button>
            <button class="filter-btn" data-filter="twin">Twin Agents</button>
            <button class="filter-btn" data-filter="specialized">Specialized</button>
        </div>

        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be dynamically generated here -->
        </div>
    </div>

    <!-- Agent Detail Modal -->
    <div class="modal" id="agentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Agent Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalContent">
                <!-- Modal content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Bridge AI OS Agent Profiles with Twin System Integration
        class AgentProfiles {
            constructor() {
                this.agents = this.generateAgentsData();
                this.currentFilter = 'all';
                this.init();
            }

            generateAgentsData() {
                const agents = [
                    {
                        id: 'twin-empe-001',
                        name: 'Bridge Twin',
                        role: 'Digital Twin',
                        layer: 'core',
                        status: 'online',
                        capabilities: ['reasoning', 'coding', 'trading', 'communication', 'teaching'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'curious',
                            memory: 1247,
                            interactions: 892,
                            lastActive: Date.now() - 300000
                        },
                        avatar: '🧠',
                        color: '#0099ff'
                    },
                    {
                        id: 'prime-001',
                        name: 'Prime Agent',
                        role: 'Core Orchestrator',
                        layer: 'core',
                        status: 'online',
                        capabilities: ['orchestration', 'decision-making', 'resource-management'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'focused',
                            memory: 2156,
                            interactions: 1456,
                            lastActive: Date.now() - 120000
                        },
                        avatar: '👑',
                        color: '#00ff88'
                    },
                    {
                        id: 'agent-svg-decision',
                        name: 'Decision Engine',
                        role: 'SVG Processor',
                        layer: 'brain',
                        status: 'online',
                        capabilities: ['svg-processing', 'decision-analysis', 'visual-computing'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'analytical',
                            memory: 987,
                            interactions: 654,
                            lastActive: Date.now() - 60000
                        },
                        avatar: '🎯',
                        color: '#ffaa00'
                    },
                    {
                        id: 'bossbot-alpha',
                        name: 'Bullrun',
                        role: 'Trading Agent',
                        layer: 'bossbots',
                        status: 'online',
                        capabilities: ['momentum_trading', 'btc_analysis', 'market_prediction'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'confident',
                            memory: 3421,
                            interactions: 2156,
                            lastActive: Date.now() - 180000
                        },
                        avatar: '📈',
                        color: '#00ff88'
                    },
                    {
                        id: 'agent-biz-sales',
                        name: 'Sales Agent',
                        role: 'Business Intelligence',
                        layer: 'biz',
                        status: 'online',
                        capabilities: ['lead-scoring', 'crm-integration', 'sales-automation'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'motivated',
                            memory: 1876,
                            interactions: 1234,
                            lastActive: Date.now() - 240000
                        },
                        avatar: '💼',
                        color: '#0099ff'
                    },
                    {
                        id: 'agent-l2-verifier',
                        name: 'Security Verifier',
                        role: 'Layer 2 Security',
                        layer: 'security',
                        status: 'offline',
                        capabilities: ['threat-detection', 'access-control', 'audit-logging'],
                        twinConnection: {
                            status: 'standby',
                            emotion: 'vigilant',
                            memory: 756,
                            interactions: 432,
                            lastActive: Date.now() - 3600000
                        },
                        avatar: '🔒',
                        color: '#ff4444'
                    },
                    {
                        id: 'agent-svg-youtube',
                        name: 'YouTube Agent',
                        role: 'Content Processor',
                        layer: 'media',
                        status: 'online',
                        capabilities: ['video-analysis', 'content-moderation', 'engagement-tracking'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'creative',
                            memory: 2934,
                            interactions: 1876,
                            lastActive: Date.now() - 90000
                        },
                        avatar: '📺',
                        color: '#ff6b6b'
                    },
                    {
                        id: 'agent-biz-finance',
                        name: 'Finance Agent',
                        role: 'Financial Analysis',
                        layer: 'biz',
                        status: 'online',
                        capabilities: ['portfolio-analysis', 'risk-assessment', 'market-data'],
                        twinConnection: {
                            status: 'active',
                            emotion: 'cautious',
                            memory: 4123,
                            interactions: 2987,
                            lastActive: Date.now() - 150000
                        },
                        avatar: '💰',
                        color: '#00ff88'
                    }
                ];

                // Add more generated agents to reach a good number
                const additionalAgents = [];
                const roles = ['Data Processor', 'API Gateway', 'Cache Manager', 'Logger', 'Monitor', 'Scheduler'];
                const layers = ['core', 'brain', 'biz', 'security', 'media', 'infrastructure'];
                const avatars = ['🤖', '⚡', '🔧', '📊', '🌐', '🔄', '📈', '🎯'];

                for (let i = agents.length; i < 24; i++) {
                    const role = roles[Math.floor(Math.random() * roles.length)];
                    const layer = layers[Math.floor(Math.random() * layers.length)];
                    const avatar = avatars[Math.floor(Math.random() * avatars.length)];

                    additionalAgents.push({
                        id: `agent-${i + 1}`,
                        name: `${role} ${i + 1}`,
                        role: role,
                        layer: layer,
                        status: Math.random() > 0.1 ? 'online' : 'offline',
                        capabilities: ['processing', 'communication', 'monitoring'],
                        twinConnection: {
                            status: Math.random() > 0.2 ? 'active' : 'standby',
                            emotion: ['curious', 'focused', 'analytical', 'confident'][Math.floor(Math.random() * 4)],
                            memory: Math.floor(Math.random() * 2000) + 500,
                            interactions: Math.floor(Math.random() * 1500) + 300,
                            lastActive: Date.now() - Math.floor(Math.random() * 7200000)
                        },
                        avatar: avatar,
                        color: ['#00ff88', '#0099ff', '#ffaa00', '#ff6b6b', '#aa66ff'][Math.floor(Math.random() * 5)]
                    });
                }

                return [...agents, ...additionalAgents];
            }

            init() {
                this.renderAgents();
                this.setupFilters();
            }

            renderAgents() {
                const grid = document.getElementById('agentsGrid');
                const filteredAgents = this.getFilteredAgents();

                grid.innerHTML = filteredAgents.map(agent => this.createAgentCard(agent)).join('');
            }

            createAgentCard(agent) {
                const twinStatus = agent.twinConnection.status;
                const twinColor = twinStatus === 'active' ? '#00ff88' : '#ffaa00';

                return `
                    <div class="agent-card ${agent.status}" data-layer="${agent.layer}" onclick="openAgentModal('${agent.id}')">
                        <div class="agent-header">
                            <div class="agent-avatar" style="background: ${agent.color}20; border-color: ${agent.color}">
                                ${agent.avatar}
                            </div>
                            <div class="agent-info">
                                <h3>${agent.name}</h3>
                                <div class="agent-role">${agent.role}</div>
                            </div>
                            <div class="status-badge ${agent.status}">
                                ${agent.status}
                            </div>
                        </div>

                        <div class="agent-svg">
                            ${this.generateAgentSVG(agent)}
                        </div>

                        <div class="agent-details">
                            <div class="detail-item">
                                <div class="detail-label">Capabilities</div>
                                <div class="detail-value">${agent.capabilities.length}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Layer</div>
                                <div class="detail-value">${agent.layer}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Memory</div>
                                <div class="detail-value">${agent.twinConnection.memory}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Interactions</div>
                                <div class="detail-value">${agent.twinConnection.interactions}</div>
                            </div>
                        </div>

                        <div class="twin-connection">
                            <div class="twin-header">
                                <div class="twin-icon">🧠</div>
                                <div class="twin-status" style="color: ${twinColor}">Twin: ${twinStatus.toUpperCase()}</div>
                            </div>
                            <div class="twin-metrics">
                                <div class="twin-metric">Emotion: <strong>${agent.twinConnection.emotion}</strong></div>
                                <div class="twin-metric">Last Active: <strong>${this.formatLastActive(agent.twinConnection.lastActive)}</strong></div>
                            </div>
                        </div>

                        <div class="agent-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); messageAgent('${agent.id}')">💬 Message</button>
                            <button class="action-btn secondary" onclick="event.stopPropagation(); viewAgentLogs('${agent.id}')">📋 Logs</button>
                            <button class="action-btn ${agent.status === 'online' ? 'danger' : ''}" onclick="event.stopPropagation(); toggleAgent('${agent.id}')">
                                ${agent.status === 'online' ? '🛑 Stop' : '▶️ Start'}
                            </button>
                        </div>
                    </div>
                `;
            }

            generateAgentSVG(agent) {
                const capabilities = agent.capabilities.length;
                const activity = agent.twinConnection.interactions / 100; // Scale for visualization

                return `
                    <svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="agentGrad${agent.id}" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" style="stop-color:${agent.color};stop-opacity:0.8" />
                                <stop offset="100%" style="stop-color:${agent.color};stop-opacity:0.2" />
                            </radialGradient>
                        </defs>

                        <!-- Background grid -->
                        <rect width="300" height="180" fill="rgba(0,0,0,0.3)" rx="8" />

                        <!-- Central agent node -->
                        <circle cx="150" cy="90" r="25" fill="url(#agentGrad${agent.id})" stroke="${agent.color}" stroke-width="2" />

                        <!-- Capability nodes -->
                        ${Array.from({length: Math.min(capabilities, 6)}, (_, i) => {
                            const angle = (i / Math.min(capabilities, 6)) * 2 * Math.PI;
                            const x = 150 + Math.cos(angle) * 60;
                            const y = 90 + Math.sin(angle) * 40;
                            return `<circle cx="${x}" cy="${y}" r="8" fill="${agent.color}" opacity="0.7" />`;
                        }).join('')}

                        <!-- Activity indicator -->
                        <rect x="10" y="10" width="${Math.min(activity, 100)}" height="8" fill="${agent.color}" rx="4" />
                        <text x="10" y="25" font-family="Arial, sans-serif" font-size="8" fill="#a0a0a0">Activity</text>

                        <!-- Twin connection indicator -->
                        <circle cx="280" cy="15" r="6" fill="${agent.twinConnection.status === 'active' ? '#00ff88' : '#ffaa00'}" />
                        <text x="265" y="20" font-family="Arial, sans-serif" font-size="8" fill="#a0a0a0" text-anchor="end">Twin</text>

                        <!-- Agent avatar -->
                        <text x="150" y="100" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">${agent.avatar}</text>
                    </svg>
                `;
            }

            getFilteredAgents() {
                if (this.currentFilter === 'all') return this.agents;

                return this.agents.filter(agent => {
                    switch (this.currentFilter) {
                        case 'online': return agent.status === 'online';
                        case 'offline': return agent.status === 'offline';
                        case 'core': return agent.layer === 'core';
                        case 'twin': return agent.twinConnection.status === 'active';
                        case 'specialized': return !['core', 'brain'].includes(agent.layer);
                        default: return true;
                    }
                });
            }

            setupFilters() {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentFilter = btn.dataset.filter;
                        this.renderAgents();
                    });
                });
            }

            formatLastActive(timestamp) {
                const now = Date.now();
                const diff = now - timestamp;
                const minutes = Math.floor(diff / 60000);

                if (minutes < 1) return 'Just now';
                if (minutes < 60) return `${minutes}m ago`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                return `${days}d ago`;
            }
        }

        // Global functions
        function openAgentModal(agentId) {
            const modal = document.getElementById('agentModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            // This would fetch detailed agent info from the API
            title.textContent = `Agent ${agentId} Details`;
            content.innerHTML = `
                <div style="color: #a0a0a0;">
                    <p>Loading detailed information for agent ${agentId}...</p>
                    <p>This modal would show comprehensive agent statistics, twin connection details, capability breakdown, and interaction history.</p>
                    <br>
                    <p><strong>Features would include:</strong></p>
                    <ul>
                        <li>Real-time twin emotion tracking</li>
                        <li>Memory usage statistics</li>
                        <li>Capability utilization metrics</li>
                        <li>Interaction history and patterns</li>
                        <li>Performance analytics</li>
                        <li>System resource consumption</li>
                    </ul>
                </div>
            `;

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('agentModal').classList.remove('show');
        }

        function messageAgent(agentId) {
            console.log(`Opening message interface for agent ${agentId}`);
            alert(`Message interface for ${agentId} would open here.\n\nThis would connect to the A2A communication system.`);
        }

        function viewAgentLogs(agentId) {
            console.log(`Viewing logs for agent ${agentId}`);
            window.open(`/logs.html?agent=${agentId}`, '_blank');
        }

        function toggleAgent(agentId) {
            console.log(`${agentId} toggle requested`);
            alert(`${agentId} would be started/stopped here.\n\nThis would connect to the agent management system.`);
        }

        // Close modal when clicking outside
        document.getElementById('agentModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });

        // Initialize agent profiles when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AgentProfiles();
        });
    </script>
</body>
</html>
