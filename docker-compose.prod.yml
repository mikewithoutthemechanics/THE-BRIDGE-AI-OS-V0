version: '3.8'

services:
  # ============================================================================
  # BRIDGE AI OS - MAIN APPLICATION
  # ============================================================================

  bridge-ai-os:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - PROMETHEUS_MULTIPROC_DIR=/tmp
    volumes:
      - ./logs:/app/logs
    networks:
      - bridge-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.bridge-ai-os.service=core"
      - "com.bridge-ai-os.monitoring=true"

  # ============================================================================
  # MONITORING STACK
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/bridge-ai-alerts.yml:/etc/prometheus/bridge-ai-alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=monitoring"

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=alerting"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=bridge-ai-admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - bridge-ai-network
    depends_on:
      - prometheus
    labels:
      - "com.bridge-ai-os.service=dashboard"

  # ============================================================================
  # INFRASTRUCTURE MONITORING
  # ============================================================================

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=infrastructure"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=infrastructure"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    volumes:
      - ./deploy/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=monitoring"

  # ============================================================================
  # LOGGING & TRACING
  # ============================================================================

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=logging"

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - tempo_data:/tmp/tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo.yml
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=tracing"

  # ============================================================================
  # DATABASE & CACHE
  # ============================================================================

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=bridge_ai_os
      - POSTGRES_USER=bridge_ai
      - POSTGRES_PASSWORD=secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=database"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=cache"

  # ============================================================================
  # MONITORING SERVICES
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=monitoring"

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=infrastructure"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=monitoring"

  # ============================================================================
  # REVERSE PROXY (SERVES ALL 11 DOMAINS + MONITORING)
  # ============================================================================

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./deploy/nginx/ssl:/etc/nginx/ssl
      - ./monitoring/dashboard:/opt/monitoring/dashboard
      - nginx_logs:/var/log/nginx
    depends_on:
      - bridge-ai-os
      - prometheus
      - node-exporter
    networks:
      - bridge-ai-network
    labels:
      - "com.bridge-ai-os.service=proxy"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  bridge-ai-network:
    driver: bridge
    labels:
      - "com.bridge-ai-os.network=true"