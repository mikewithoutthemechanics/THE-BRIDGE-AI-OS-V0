upstream this_side {
    server gateway:8080;
}

upstream other_side {
    server gateway-other:8080;
}

upstream bridge_service {
    server bridge-service:9000;
}

server {
    listen 80;
    server_name ai-os.co.za *.ai-os.co.za;
    
    # Redirect HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai-os.co.za;

    ssl_certificate /etc/nginx/certs/ai-os.co.za.crt;
    ssl_certificate_key /etc/nginx/certs/ai-os.co.za.key;

    # THIS SIDE (Primary Control Plane)
    location / {
        proxy_pass http://this_side;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Origin this;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://this_side;
        access_log off;
    }
}

server {
    listen 443 ssl http2;
    server_name other.ai-os.co.za;

    ssl_certificate /etc/nginx/certs/ai-os.co.za.crt;
    ssl_certificate_key /etc/nginx/certs/ai-os.co.za.key;

    # OTHER SIDE (Mirror Execution Plane)
    location / {
        proxy_pass http://other_side;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Origin other;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://other_side;
        access_log off;
    }
}

server {
    listen 443 ssl http2;
    server_name bridge.ai-os.co.za;

    ssl_certificate /etc/nginx/certs/ai-os.co.za.crt;
    ssl_certificate_key /etc/nginx/certs/ai-os.co.za.key;

    # BRIDGE SERVICE (Sync & Routing)
    location / {
        proxy_pass http://bridge_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://bridge_service;
        access_log off;
    }
}

server {
    listen 443 ssl http2;
    server_name go.ai-os.co.za;

    ssl_certificate /etc/nginx/certs/ai-os.co.za.crt;
    ssl_certificate_key /etc/nginx/certs/ai-os.co.za.key;

    # Gateway shorthand - routes intelligently to appropriate side
    location / {
        proxy_pass http://this_side;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Origin auto;
    }
}
