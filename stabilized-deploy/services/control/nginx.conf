server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Health check endpoint - returns 200 directly
    location = /api/health {
        default_type application/json;
        return 200 '{"service":"control","status":"healthy","timestamp":"${date_iso_8601}"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}