# BridgeAI OS v3 - Maintenance Configuration
# Automated maintenance tasks and schedules

[maintenance]
# Health check intervals (seconds)
health_check_interval = 30
service_timeout = 300

# Backup configuration
backup_enabled = true
backup_interval_hours = 6
backup_retention_days = 30
backup_location = /opt/bridge-ai/backups

# Log rotation
log_rotation_enabled = true
log_max_age_days = 30
log_max_size_mb = 100

# Auto-scaling
auto_scaling_enabled = true
cpu_threshold_high = 80
cpu_threshold_low = 20
memory_threshold_high = 85
memory_threshold_low = 15

# Alerting
alerting_enabled = true
alert_email = admin@bridge-ai-os.com
alert_slack_webhook = ${SLACK_WEBHOOK_URL}
alert_sms_enabled = false

# Monitoring
monitoring_enabled = true
metrics_retention_days = 90
prometheus_url = http://metrics:9090
grafana_url = http://grafana:3005

# Security
security_scan_enabled = true
security_scan_interval_hours = 24
vulnerability_threshold = HIGH

# Performance
performance_monitoring = true
slow_query_threshold_ms = 1000
memory_leak_detection = true

[services]
# Service-specific configurations
config-service.health_endpoint = /health
config-service.metrics_endpoint = /metrics
config-service.backup_critical = true

admin-api.health_endpoint = /health
admin-api.metrics_endpoint = /metrics

treasury.health_endpoint = /health
treasury.backup_critical = true
treasury.audit_enabled = true

gateway.health_endpoint = /health
gateway.rate_limiting = true

super-brain.health_endpoint = /health
super-brain.model_monitoring = true
super-brain.gpu_monitoring = true

telephony.health_endpoint = /health
telephony.call_monitoring = true

svg-engine.health_endpoint = /health

[databases]
# Database maintenance
postgres.maintenance_enabled = true
postgres.vacuum_interval_hours = 24
postgres.reindex_interval_days = 7

redis.maintenance_enabled = true
redis.memory_limit_gb = 8

[networking]
# Network configuration
internal_network = bridge-ai-network
external_access = true
load_balancer = nginx
ssl_enabled = true
ssl_cert_path = /etc/ssl/certs/bridge-ai.crt
ssl_key_path = /etc/ssl/private/bridge-ai.key

[integrations]
# External service integrations
linea_rpc_url = https://rpc.linea.build
ethereum_rpc_url = https://mainnet.infura.io/v3/${INFURA_PROJECT_ID}
openai_api_url = https://api.openai.com/v1
anthropic_api_url = https://api.anthropic.com
twilio_api_url = https://api.twilio.com

[deployment]
# Deployment configuration
docker_registry = registry.bridge-ai-os.com
image_tag = v3.0.0
rolling_update = true
rollback_enabled = true
blue_green_deployment = false

[monitoring]
# Advanced monitoring
apm_enabled = true
distributed_tracing = true
log_aggregation = true
error_tracking = true
performance_profiling = true