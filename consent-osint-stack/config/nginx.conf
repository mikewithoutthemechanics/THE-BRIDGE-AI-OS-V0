# Nginx Configuration for ConsentVault
# TLS Termination, Rate Limiting, Authentication

events {
    worker_connections 1024;
}

http {
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream Services
    upstream consent_api {
        server consent-api:8080;
    }

    upstream databunker_api {
        server databunker-api:8081;
    }

    upstream dashboard {
        server dashboard:3000;
    }

    upstream analytics {
        server analytics-engine:8082;
    }

    upstream monetization {
        server monetization-api:8083;
    }

    upstream spiderfoot {
        server spiderfoot-demo:5001;
    }

    # Dashboard (HTTPS)
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA512;

        # Client certificate auth for production
        # ssl_verify_client on;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/consent/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://consent_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/vault/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://databunker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/analytics/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/monetization/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://monetization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /spiderfoot/ {
            proxy_pass http://spiderfoot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
