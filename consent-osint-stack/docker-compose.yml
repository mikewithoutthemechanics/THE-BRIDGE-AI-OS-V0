version: '3.9'

services:
  # =============================================================================
  # CORE INFRASTRUCTURE
  # =============================================================================

  nginx-gateway:
    image: nginx:alpine
    container_name: consentvault-nginx
    ports:
      - "8443:8443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - consentvault
    depends_on:
      - consent-api
      - databunker-api
      - dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # CONSENT & GOVERNANCE LAYER
  # =============================================================================

  consent-ledger:
    image: postgres:15-alpine
    container_name: consentvault-consent-ledger
    environment:
      POSTGRES_DB: consent_ledger
      POSTGRES_USER: consent_user
      POSTGRES_PASSWORD: ${CONSENT_DB_PASSWORD:-changeme}
    volumes:
      - consent-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - consentvault
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "consent_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  consent-api:
    build:
      context: ./consent-api
      dockerfile: Dockerfile
    container_name: consentvault-consent-api
    environment:
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
      JWT_SECRET: ${JWT_SECRET:-changeme}
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
    volumes:
      - ./consent-api:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - consentvault
    depends_on:
      consent-ledger:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1770

  # =============================================================================
  # DATA VAULT (Databunker)
  # =============================================================================

  databunker:
    image: securecodebox/databunker:latest
    container_name: consentvault-databunker
    environment:
      DATABUNKER_STORAGE: sqlite
      DATABUNKER_SQLITE_PATH: /opt/databunker/databunker.db
      DATABUNKER_ADMIN_TOKEN: ${DATABUNKER_TOKEN:-changeme}
      DATABUNKER_ENCRYPTION_KEY: ${DATABUNKER_ENCRYPTION_KEY:-changeme}
      DATABUNKER_AUDIT_ENABLED: "true"
    volumes:
      - databunker-data:/opt/databunker
    networks:
      - consentvault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  databunker-api:
    build:
      context: ./databunker-api
      dockerfile: Dockerfile
    container_name: consentvault-databunker-api
    environment:
      DATABUNKER_URL: http://databunker:3000
      DATABUNKER_TOKEN: ${DATABUNKER_TOKEN:-changeme}
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
    networks:
      - consentvault
    depends_on:
      - databunker
      - consent-ledger
    restart: unless-stopped
    read_only: true

  # =============================================================================
  # OSINT ORCHESTRATOR (Sandboxed)
  # =============================================================================

  osint-orchestrator:
    build:
      context: ./osint-orchestrator
      dockerfile: Dockerfile
    container_name: consentvault-osint-orch
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
      SHERLOCK_API_KEY: ${SHERLOCK_API_KEY:-demo}
      MAIGRET_MODE: ${DEMO_MODE:-true}
      SPIDERFOOT_MODE: ${DEMO_MODE:-true}
      HOLEHE_MODE: ${DEMO_MODE:-true}
      GHUNT_MODE: ${DEMO_MODE:-true}
      CONSENT_API_URL: http://consent-api:8080
      DATABUNKER_URL: http://databunker:3000
    volumes:
      - osint-data:/app/data
      - osint-synthetic:/app/synthetic
      - ./synthetic-datasets:/app/synthetic-datasets:ro
    networks:
      - consentvault
    depends_on:
      consent-api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1770

  # =============================================================================
  # OSINT TOOLS (Demo/Synthetic Only)
  # =============================================================================

  sherlock-demo:
    build:
      context: ./osint-tools/sherlock
      dockerfile: Dockerfile
    container_name: consentvault-sherlock
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
    volumes:
      - ./synthetic-datasets/sherlock:/data:ro
    networks:
      - consentvault
    restart: unless-stopped
    read_only: true

  maigret-demo:
    build:
      context: ./osint-tools/maigret
      dockerfile: Dockerfile
    container_name: consentvault-maigret
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
    volumes:
      - ./synthetic-datasets/maigret:/data:ro
    networks:
      - consentvault
    restart: unless-stopped
    read_only: true

  spiderfoot-demo:
    image: spiderfoot/spiderfoot:latest
    container_name: consentvault-spiderfoot
    environment:
      SF_PORT: 5001
      SF_UI_PASSWORD: ${SPIDERFOOT_PASSWORD:-changeme}
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - spiderfoot-data:/app/data
      - ./synthetic-datasets/spiderfoot:/sf-modules/synthetic:ro
    networks:
      - consentvault
    restart: unless-stopped

  # =============================================================================
  # ANALYTICS & MONETIZATION
  # =============================================================================

  analytics-engine:
    build:
      context: ./analytics-engine
      dockerfile: Dockerfile
    container_name: consentvault-analytics
    environment:
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
      DATABUNKER_URL: http://databunker:3000
      DEMO_MODE: ${DEMO_MODE:-true}
      AGGREGATION_MODE: "strict"
      DP_EPSILON: 1.0
      K_ANONYMITY: 5
    volumes:
      - analytics-data:/app/data
    networks:
      - consentvault
    depends_on:
      - consent-ledger
      - databunker
    restart: unless-stopped
    read_only: true

  monetization-api:
    build:
      context: ./monetization-api
      dockerfile: Dockerfile
    container_name: consentvault-monetization
    environment:
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
      CONSENT_API_URL: http://consent-api:8080
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-disabled}
      ALLOWED_DATASET_TYPES: "aggregated,anonymized,pseudonymized"
      STRICT_MODE: "true"
    networks:
      - consentvault
    depends_on:
      - consent-api
      - analytics-engine
    restart: unless-stopped
    read_only: true

  # =============================================================================
  # DASHBOARD & UI
  # =============================================================================

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: consentvault-dashboard
    environment:
      CONSENT_API_URL: http://consent-api:8080
      ANALYTICS_API_URL: http://analytics-engine:8080
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "3000:3000"
    networks:
      - consentvault
    depends_on:
      - consent-api
      - analytics-engine
    restart: unless-stopped

  # =============================================================================
  # MONITORING & AUDIT
  # =============================================================================

  audit-logger:
    image: grafana/loki:latest
    container_name: consentvault-audit
    volumes:
      - ./config/local-config.yaml:/etc/loki/local-config.yaml:ro
      - audit-logs:/var/loki
    networks:
      - consentvault
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: consentvault-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - consentvault
    restart: unless-stopped

networks:
  consentvault:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  consent-data:
  databunker-data:
  osint-data:
  osint-synthetic:
  spiderfoot-data:
  analytics-data:
  audit-logs:
  prometheus-data:
