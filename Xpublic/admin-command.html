<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Command Center — Bridge AI OS</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700">
    <a href="/" class="text-xl font-bold text-orange-400">⚡ Admin Command</a>
    <div class="flex gap-4">
      <a href="/admin.html" class="text-slate-400 hover:text-orange-400">Admin</a>
      <a href="/settings.html" class="text-slate-400 hover:text-cyan-400">Settings</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-orange-400 mb-6">Command Center</h1>

    <div class="grid md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-cyan-400" id="users">0</div>
        <div class="text-sm text-slate-400">Total Users</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-green-400" id="active">0</div>
        <div class="text-sm text-slate-400">Active Sessions</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-yellow-400" id="pending">0</div>
        <div class="text-sm text-slate-400">Pending Actions</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-red-400" id="errors">0</div>
        <div class="text-sm text-slate-400">Errors (24h)</div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
        <h2 class="text-lg font-bold text-orange-400 mb-4">Quick Commands</h2>
        <div class="space-y-2">
          <button onclick="runCommand('clear-cache')" class="w-full bg-slate-700 p-3 rounded text-left hover:bg-slate-600">
            🗑️ Clear Cache
          </button>
          <button onclick="runCommand('restart-services')" class="w-full bg-slate-700 p-3 rounded text-left hover:bg-slate-600">
            🔄 Restart Services
          </button>
          <button onclick="runCommand('sync-agents')" class="w-full bg-slate-700 p-3 rounded text-left hover:bg-slate-600">
            🤖 Sync Agents
          </button>
          <button onclick="runCommand('backup-db')" class="w-full bg-slate-700 p-3 rounded text-left hover:bg-slate-600">
            💾 Backup Database
          </button>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
        <h2 class="text-lg font-bold text-orange-400 mb-4">System Status</h2>
        <div id="services" class="space-y-3">
          <div class="flex justify-between"><span>API</span><span class="text-green-400">● Online</span></div>
          <div class="flex justify-between"><span>Database</span><span class="text-green-400">● Online</span></div>
          <div class="flex justify-between"><span>Cache</span><span class="text-green-400">● Online</span></div>
          <div class="flex justify-between"><span>Workers</span><span class="text-yellow-400">● Degraded</span></div>
        </div>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
      <h2 class="text-lg font-bold text-orange-400 mb-4">Terminal</h2>
      <div class="flex gap-2">
        <input type="text" id="cmd" class="flex-1 bg-slate-900 border border-slate-600 rounded px-4 py-2 text-white font-mono" placeholder="Enter admin command...">
        <button onclick="execute()" class="bg-orange-600 text-white px-6 py-2 rounded font-bold hover:bg-orange-500">Run</button>
      </div>
      <div id="output" class="mt-4 p-4 bg-slate-900 rounded font-mono text-sm max-h-60 overflow-auto">
        <div class="text-slate-500">Ready for commands...</div>
      </div>
    </div>
  </main>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        const data = await res.json();
        document.getElementById('users').textContent = data.users || 0;
        document.getElementById('active').textContent = data.active || 0;
        document.getElementById('pending').textContent = data.pending || 0;
        document.getElementById('errors').textContent = data.errors || 0;
      } catch(e) {}
    }

    async function runCommand(cmd) {
      const output = document.getElementById('output');
      output.innerHTML += `<div class="text-orange-400">$ ${cmd}</div>`;
      
      try {
        const res = await fetch('/api/admin/command', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        output.innerHTML += `<div class="text-green-400">${JSON.stringify(data, null, 2)}</div>`;
      } catch(e) {
        output.innerHTML += `<div class="text-red-400">Error: ${e.message}</div>`;
      }
      output.scrollTop = output.scrollHeight;
    }

    function execute() {
      const cmd = document.getElementById('cmd').value;
      if (cmd) runCommand(cmd);
    }

    loadStats();
  </script>
</body>
</html>
