<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI — Bridge AI OS</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center">
    <a href="/" class="text-xl font-bold text-cyan-400">Bridge AI OS</a>
    <div class="flex gap-4">
      <a href="/home.html" class="text-slate-400 hover:text-cyan-400">Home</a>
      <a href="/portal.html" class="text-cyan-400">Voice AI</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-6">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-cyan-400 mb-2">Voice AI Agent</h1>
      <p class="text-slate-400">Conversational AI with emotion, speech synthesis, and avatar</p>
    </div>

    <div class="bg-slate-800 rounded-xl p-6 mb-6">
      <div class="flex flex-col items-center">
        <div id="avatar" class="w-48 h-48 rounded-full bg-gradient-to-br from-cyan-500 to-purple-500 flex items-center justify-center text-6xl mb-6">
          🤖
        </div>
        
        <div id="emotion" class="text-cyan-400 text-lg mb-4">Ready</div>
        
        <div class="flex gap-4 mb-6">
          <button onclick="speak('Hello! I am your AI voice assistant.')" class="bg-cyan-500 text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-cyan-400">
            Test Voice
          </button>
          <button onclick="toggleListening()" id="listenBtn" class="bg-green-500 text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-green-400">
            Listen
          </button>
        </div>

        <textarea id="inputText" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-4 text-white" rows="3" placeholder="Type a message or click Listen to speak..."></textarea>
        
        <button onclick="sendMessage()" class="mt-4 bg-purple-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-purple-500">
          Send Message
        </button>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-lg font-bold text-cyan-400 mb-4">Voice Settings</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Voice</label>
          <select id="voiceSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white">
            <option value="neurolink">NeuroLink Voice</option>
            <option value="aurora">Aurora Voice</option>
            <option value="custom">Custom Voice</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Emotion</label>
          <select id="emotionSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white">
            <option value="neutral">Neutral</option>
            <option value="happy">Happy</option>
            <option value="excited">Excited</option>
            <option value="calm">Calm</option>
            <option value="serious">Serious</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Speed</label>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1" class="w-full">
        </div>
      </div>
    </div>
  </main>

  <script>
    async function sendMessage() {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) return;

      document.getElementById('emotion').textContent = 'Thinking...';
      
      try {
        const res = await fetch('/api/speech/embody', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            text,
            emotion: document.getElementById('emotionSelect').value,
            voice: document.getElementById('voiceSelect').value,
            speed: parseFloat(document.getElementById('speedRange').value)
          })
        });
        const data = await res.json();
        
        if (data.audio) {
          playAudio(data.audio);
          document.getElementById('emotion').textContent = data.emotion || 'Speaking';
        }
      } catch(e) {
        document.getElementById('emotion').textContent = 'Error: ' + e.message;
      }
    }

    function speak(text) {
      fetch('/api/speech/speak', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text, voice: 'neurolink' })
      }).then(r => r.json()).then(d => {
        if (d.audio) playAudio(d.audio);
      });
    }

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play();
    }

    function toggleListening() {
      const btn = document.getElementById('listenBtn');
      if (btn.textContent === 'Listen') {
        btn.textContent = 'Stop';
        btn.className = 'bg-red-500 text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-red-400';
      } else {
        btn.textContent = 'Listen';
        btn.className = 'bg-green-500 text-slate-900 px-6 py-2 rounded-lg font-bold hover:bg-green-400';
      }
    }
  </script>
</body>
</html>
