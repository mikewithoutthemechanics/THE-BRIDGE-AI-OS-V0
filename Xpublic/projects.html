<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Bridge AI OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#050a0f;--surface:#0d1620;--surface2:#111d2b;--border:#1a2d40;--accent:#00c8ff;--green:#00e57b;--red:#ff3c5a;--yellow:#ffd166;--text:#c8dce8;--dim:#4d6678;--purple:#a78bfa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .btn{padding:.5rem 1rem;border-radius:.4rem;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-block}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--dim)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-primary{background:var(--accent);color:#050a0f}
    .btn-primary:hover{opacity:.88}
    .btn-danger{background:transparent;border:1px solid var(--border);color:var(--red)}
    .btn-danger:hover{border-color:var(--red)}
    .btn-sm{padding:.35rem .75rem;font-size:.73rem}
    .btn-green{background:var(--green);color:#050a0f}
    .btn-green:hover{opacity:.88}

    .topbar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
    .logo{font-size:1.3rem;font-weight:800;color:var(--accent);letter-spacing:.2em}
    .logo span{color:var(--green)}
    .topbar-nav{display:flex;gap:1.5rem;align-items:center;font-size:.82rem}
    .topbar-nav a{color:var(--dim);transition:color .2s}
    .topbar-nav a:hover,.topbar-nav a.active{color:var(--text)}

    .page{max-width:1100px;margin:0 auto;padding:2rem}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
    .page-title{font-size:1.4rem;font-weight:800}

    /* Filters */
    .filters{display:flex;gap:.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--dim);padding:.35rem .85rem;border-radius:2rem;font-size:.75rem;cursor:pointer;transition:all .2s}
    .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,200,255,.06)}

    /* Project grid */
    .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}

    .project-card{background:var(--surface);border:1.5px solid var(--border);border-radius:.7rem;overflow:hidden;transition:all .2s;cursor:pointer;display:flex;flex-direction:column}
    .project-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,200,255,.06)}
    .project-card-header{padding:1.1rem 1.1rem .7rem;border-bottom:1px solid var(--border);flex:1}
    .project-tool-tag{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.18rem .5rem;border-radius:2rem;background:rgba(167,139,250,.1);color:var(--purple);margin-bottom:.6rem}
    .project-card-name{font-size:.95rem;font-weight:700;margin-bottom:.3rem}
    .project-card-intent{font-size:.75rem;color:var(--dim);line-height:1.4;margin-bottom:.7rem}
    .project-card-footer{padding:.75rem 1.1rem;display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
    .project-stats{font-size:.72rem;color:var(--dim);display:flex;gap:.8rem}
    .project-stat{display:flex;align-items:center;gap:.25rem}
    .project-stat strong{color:var(--text)}
    .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:.3rem}
    .dot-active{background:var(--green)}
    .dot-archived{background:var(--dim)}

    /* Detail panel (slide in) */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:stretch;justify-content:flex-end}
    .detail-overlay.open{display:flex}
    .detail-panel{width:500px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;animation:slideIn .22s ease}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .detail-header{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border)}
    .detail-title{font-size:1rem;font-weight:700}
    .close-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1.2rem;padding:.2rem .4rem}
    .close-btn:hover{color:var(--text)}
    .detail-body{flex:1;overflow-y:auto;padding:1.5rem}
    .detail-section{margin-bottom:1.5rem}
    .detail-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem}
    .run-item{background:var(--surface2);border:1px solid var(--border);border-radius:.4rem;padding:.65rem .8rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center}
    .run-status{font-size:.65rem;font-weight:700;text-transform:uppercase;padding:.15rem .4rem;border-radius:2rem}
    .rs-completed{background:rgba(0,229,123,.1);color:var(--green)}
    .rs-failed{background:rgba(255,60,90,.08);color:var(--red)}
    .rs-running{background:rgba(0,200,255,.1);color:var(--accent)}
    .output-chip{background:var(--surface2);border:1px solid var(--border);border-radius:.4rem;padding:.5rem .75rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
    .output-chip-title{font-weight:500}
    .output-chip-fmt{font-size:.65rem;font-weight:700;text-transform:uppercase;color:var(--purple)}
    .integration-row{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
    .detail-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.6rem}

    /* New project modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:.8rem;width:480px;max-width:95vw;padding:1.8rem;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
    .modal-title{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem}
    .form-group{margin-bottom:.9rem}
    label{display:block;font-size:.72rem;color:var(--dim);margin-bottom:.3rem}
    input[type=text],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:.4rem;padding:.65rem .9rem;font-size:.85rem;font-family:inherit;outline:none;transition:border-color .2s}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{resize:vertical;height:72px}
    select option{background:var(--surface2)}
    .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
    .error-msg{background:rgba(255,60,90,.07);border:1px solid rgba(255,60,90,.25);color:var(--red);border-radius:.4rem;padding:.55rem .85rem;font-size:.78rem;margin-bottom:.8rem;display:none}
    .error-msg.show{display:block}
    .loading{color:var(--dim);font-size:.85rem;text-align:center;padding:3rem}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--dim)}
    .empty-state .icon{font-size:3rem;opacity:.25;margin-bottom:1rem}
  </style>

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){body{font-size:15px}.desktop-only{display:none!important}}
@media(max-width:480px){body{font-size:14px}h1{font-size:1.5rem!important}h2{font-size:1.25rem!important}}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:1.5rem">
    <a href="/" class="logo">BRIDGE<span>AI</span></a>
    <div class="topbar-nav">
      <a href="/profile">Profile</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </div>
  <div style="display:flex;gap:.6rem">
    <button class="btn btn-primary btn-sm" onclick="openNewModal()">+ New Project</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div class="page-title">Projects</div>
    <div style="display:flex;gap:.6rem">
      <button class="btn btn-outline btn-sm" onclick="loadProjects()">↻ Refresh</button>
      <button class="btn btn-primary" onclick="openNewModal()">+ New Project</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('active',this)">Active</button>
    <button class="filter-btn" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('archived',this)">Archived</button>
  </div>

  <div class="project-grid" id="projectGrid">
    <div class="loading">Loading projects…</div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle">Project Details</div>
      <button class="close-btn" onclick="closeDetailPanel()">✕</button>
    </div>
    <div class="detail-body" id="detailBody">
      <div class="loading">Loading…</div>
    </div>
    <div class="detail-footer" id="detailFooter">
      <button class="btn btn-outline btn-sm" onclick="closeDetailPanel()">Close</button>
    </div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">New Project</div>
    <div class="error-msg" id="newErr"></div>
    <div class="form-group">
      <label>Project name</label>
      <input type="text" id="newName" placeholder="My Growth Campaign">
    </div>
    <div class="form-group">
      <label>Tool</label>
      <select id="newTool">
        <option value="">No tool (generic)</option>
        <option value="growth-engine">Growth Engine</option>
        <option value="avatar-ai">Avatar AI</option>
        <option value="marketplace-builder">Marketplace Builder</option>
        <option value="neurolink">NeuroLink</option>
        <option value="analytics">Analytics Engine</option>
        <option value="ap2-orchestrator">AP2 Orchestrator</option>
      </select>
    </div>
    <div class="form-group">
      <label>Goal / intent</label>
      <textarea id="newIntent" placeholder="Describe what you want this project to achieve…"></textarea>
    </div>
    <div class="form-group">
      <label>Integration targets</label>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem" id="intgPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeNewModal()">Cancel</button>
      <button class="btn btn-primary" id="createProjectBtn" onclick="createProject()">Create Project</button>
    </div>
  </div>
</div>

<script>
let token = null;
let currentFilter = 'active';
const selectedIntegrations = new Set();

const INTEGRATIONS = ['slack','github','notion','zapier','mcp','clr'];

function getToken() {
  const match = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('bridge_token='));
  return match ? match.split('=')[1] : localStorage.getItem('bridge_token');
}

async function authFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
  });
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadProjects();
}

function makeProjectCard(p) {
  const card = document.createElement('div');
  card.className = 'project-card';

  const header = document.createElement('div');
  header.className = 'project-card-header';

  if (p.tool_id) {
    const tag = document.createElement('div');
    tag.className = 'project-tool-tag';
    tag.textContent = p.tool_id.replace(/-/g, ' ');
    header.appendChild(tag);
  }

  const name = document.createElement('div');
  name.className = 'project-card-name';
  name.textContent = p.name;

  const intent = document.createElement('div');
  intent.className = 'project-card-intent';
  intent.textContent = p.intent || 'No description';

  header.appendChild(name); header.appendChild(intent);

  const footer = document.createElement('div');
  footer.className = 'project-card-footer';

  const stats = document.createElement('div');
  stats.className = 'project-stats';

  const dotSpan = document.createElement('span');
  const dot = document.createElement('span');
  dot.className = 'status-dot dot-' + p.status;
  dotSpan.appendChild(dot);
  dotSpan.appendChild(document.createTextNode(p.status));
  stats.appendChild(dotSpan);

  const runStat = document.createElement('span');
  runStat.className = 'project-stat';
  runStat.appendChild(document.createTextNode(''));
  const runStrong = document.createElement('strong');
  runStrong.textContent = p.run_count || 0;
  runStat.appendChild(runStrong);
  runStat.appendChild(document.createTextNode(' runs'));
  stats.appendChild(runStat);

  const outStat = document.createElement('span');
  outStat.className = 'project-stat';
  const outStrong = document.createElement('strong');
  outStrong.textContent = p.output_count || 0;
  outStat.appendChild(outStrong);
  outStat.appendChild(document.createTextNode(' outputs'));
  stats.appendChild(outStat);

  const dateEl = document.createElement('span');
  dateEl.style.fontSize = '.68rem'; dateEl.style.color = 'var(--dim)';
  dateEl.textContent = new Date(p.updated_at).toLocaleDateString();

  footer.appendChild(stats); footer.appendChild(dateEl);
  card.appendChild(header); card.appendChild(footer);

  card.addEventListener('click', () => openDetail(p.id));
  return card;
}

async function loadProjects() {
  const grid = document.getElementById('projectGrid');
  grid.textContent = '';
  const loading = document.createElement('div'); loading.className = 'loading';
  loading.textContent = 'Loading projects…'; grid.appendChild(loading);

  try {
    const status = currentFilter === 'all' ? '' : '?status=' + currentFilter;
    const res = await authFetch('/api/platform/projects' + status);
    const data = await res.json();
    grid.textContent = '';

    if (!data.projects || data.projects.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.style.gridColumn = '1/-1';
      const icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = '📁';
      const msg = document.createElement('div'); msg.style.marginBottom = '.75rem';
      msg.textContent = currentFilter === 'active' ? 'No active projects yet.' : 'No projects found.';
      const link = document.createElement('button'); link.className = 'btn btn-primary';
      link.textContent = '+ Create your first project'; link.addEventListener('click', openNewModal);
      empty.appendChild(icon); empty.appendChild(msg); empty.appendChild(link);
      grid.appendChild(empty);
    } else {
      data.projects.forEach(p => grid.appendChild(makeProjectCard(p)));
    }
  } catch {
    grid.textContent = '';
    const err = document.createElement('div'); err.className = 'loading';
    err.textContent = 'Failed to load projects.'; grid.appendChild(err);
  }
}

async function openDetail(projectId) {
  document.getElementById('detailOverlay').classList.add('open');
  const body = document.getElementById('detailBody');
  body.textContent = '';
  const loading = document.createElement('div'); loading.className = 'loading';
  loading.textContent = 'Loading…'; body.appendChild(loading);

  try {
    const res = await authFetch('/api/platform/projects/' + encodeURIComponent(projectId));
    const data = await res.json();
    if (!data.ok) { body.textContent = 'Failed to load project.'; return; }

    const { project, runs, outputs } = data;
    body.textContent = '';
    document.getElementById('detailTitle').textContent = project.name;

    // Info section
    const infoSection = document.createElement('div');
    infoSection.className = 'detail-section';
    const infoLabel = document.createElement('div'); infoLabel.className = 'detail-label';
    infoLabel.textContent = 'Project Info';
    infoSection.appendChild(infoLabel);

    [['Tool', project.tool_id || 'None'], ['Status', project.status], ['Intent', project.intent || 'Not set'], ['Created', new Date(project.created_at).toLocaleDateString()]].forEach(([k, v]) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;font-size:.8rem;padding:.35rem 0;border-bottom:1px solid var(--border)';
      const kEl = document.createElement('span'); kEl.style.color = 'var(--dim)'; kEl.textContent = k;
      const vEl = document.createElement('span'); vEl.style.fontWeight = '500'; vEl.textContent = v;
      row.appendChild(kEl); row.appendChild(vEl); infoSection.appendChild(row);
    });
    body.appendChild(infoSection);

    // Runs section
    const runsSection = document.createElement('div');
    runsSection.className = 'detail-section';
    const runsLabel = document.createElement('div'); runsLabel.className = 'detail-label';
    runsLabel.textContent = 'Recent Runs (' + (runs.length) + ')';
    runsSection.appendChild(runsLabel);
    if (runs.length === 0) {
      const empty = document.createElement('div'); empty.style.cssText = 'font-size:.78rem;color:var(--dim)';
      empty.textContent = 'No runs yet.'; runsSection.appendChild(empty);
    } else {
      runs.slice(0, 5).forEach(r => {
        const item = document.createElement('div'); item.className = 'run-item';
        const info = document.createElement('div');
        const timeEl = document.createElement('div'); timeEl.style.fontSize = '.75rem'; timeEl.style.color = 'var(--dim)';
        timeEl.textContent = new Date(r.started_at).toLocaleString();
        const latEl = document.createElement('div'); latEl.style.fontSize = '.7rem'; latEl.style.color = 'var(--dim)';
        latEl.textContent = r.latency_ms ? r.latency_ms + ' ms' : '—';
        info.appendChild(timeEl); info.appendChild(latEl);
        const status = document.createElement('span');
        status.className = 'run-status rs-' + r.status; status.textContent = r.status;
        item.appendChild(info); item.appendChild(status);
        runsSection.appendChild(item);
      });
    }
    body.appendChild(runsSection);

    // Outputs section
    const outsSection = document.createElement('div');
    outsSection.className = 'detail-section';
    const outsLabel = document.createElement('div'); outsLabel.className = 'detail-label';
    outsLabel.textContent = 'Outputs (' + outputs.length + ')';
    outsSection.appendChild(outsLabel);
    if (outputs.length === 0) {
      const empty = document.createElement('div'); empty.style.cssText = 'font-size:.78rem;color:var(--dim)';
      empty.textContent = 'No outputs yet.'; outsSection.appendChild(empty);
    } else {
      outputs.slice(0, 6).forEach(o => {
        const chip = document.createElement('div'); chip.className = 'output-chip';
        const left = document.createElement('div');
        const titleEl = document.createElement('div'); titleEl.className = 'output-chip-title';
        titleEl.textContent = o.title || 'Output';
        const metaEl = document.createElement('div'); metaEl.style.cssText = 'font-size:.68rem;color:var(--dim)';
        metaEl.textContent = o.status + ' · ' + new Date(o.created_at).toLocaleDateString();
        left.appendChild(titleEl); left.appendChild(metaEl);
        const fmt = document.createElement('div'); fmt.className = 'output-chip-fmt';
        fmt.textContent = o.format;
        const dlLink = document.createElement('a');
        dlLink.href = '/api/platform/outputs/' + encodeURIComponent(o.id) + '/export?token=' + token;
        dlLink.className = 'btn btn-outline btn-sm'; dlLink.textContent = '↓';
        chip.appendChild(left); chip.appendChild(fmt); chip.appendChild(dlLink);
        outsSection.appendChild(chip);
      });
    }
    body.appendChild(outsSection);

    // Integrations targets on project
    if (project.integration_targets && project.integration_targets.length > 0) {
      const intgSection = document.createElement('div');
      intgSection.className = 'detail-section';
      const intgLabel = document.createElement('div'); intgLabel.className = 'detail-label';
      intgLabel.textContent = 'Integration Targets';
      intgSection.appendChild(intgLabel);
      project.integration_targets.forEach(t => {
        const row = document.createElement('div'); row.className = 'integration-row';
        const nameEl = document.createElement('span'); nameEl.textContent = t;
        const btn = document.createElement('button'); btn.className = 'btn btn-outline btn-sm';
        btn.textContent = 'Push output'; btn.addEventListener('click', () => { alert('Open integration dialog for: ' + t); });
        row.appendChild(nameEl); row.appendChild(btn);
        intgSection.appendChild(row);
      });
      body.appendChild(intgSection);
    }

    // Footer actions
    const footer = document.getElementById('detailFooter');
    footer.textContent = '';
    const closeBtn = document.createElement('button'); closeBtn.className = 'btn btn-outline btn-sm';
    closeBtn.textContent = 'Close'; closeBtn.addEventListener('click', closeDetailPanel);
    const archiveBtn = document.createElement('button'); archiveBtn.className = 'btn btn-danger btn-sm';
    archiveBtn.textContent = 'Archive'; archiveBtn.addEventListener('click', async () => {
      if (!confirm('Archive this project? You can restore it later.')) return;
      await authFetch('/api/platform/projects/' + encodeURIComponent(projectId), { method: 'DELETE' });
      closeDetailPanel(); loadProjects();
    });
    footer.appendChild(closeBtn); footer.appendChild(archiveBtn);

  } catch {
    body.textContent = 'Error loading project.';
  }
}

function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetailPanel();
}

function closeDetailPanel() {
  document.getElementById('detailOverlay').classList.remove('open');
}

/* New project modal */
function buildIntgPicker() {
  const picker = document.getElementById('intgPicker');
  picker.textContent = '';
  INTEGRATIONS.forEach(id => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-btn' + (selectedIntegrations.has(id) ? ' active' : '');
    chip.textContent = id;
    chip.dataset.id = id;
    chip.addEventListener('click', () => {
      if (selectedIntegrations.has(id)) { selectedIntegrations.delete(id); chip.classList.remove('active'); }
      else { selectedIntegrations.add(id); chip.classList.add('active'); }
    });
    picker.appendChild(chip);
  });
}

function openNewModal() {
  selectedIntegrations.clear();
  document.getElementById('newName').value = '';
  document.getElementById('newTool').value = '';
  document.getElementById('newIntent').value = '';
  document.getElementById('newErr').classList.remove('show');
  buildIntgPicker();
  document.getElementById('newModal').classList.add('open');
}

function closeNewModal() {
  document.getElementById('newModal').classList.remove('open');
}

document.getElementById('newModal').addEventListener('click', e => {
  if (e.target === document.getElementById('newModal')) closeNewModal();
});

async function createProject() {
  const name = document.getElementById('newName').value.trim();
  const toolId = document.getElementById('newTool').value;
  const intent = document.getElementById('newIntent').value.trim();
  const errEl = document.getElementById('newErr');
  const btn = document.getElementById('createProjectBtn');

  errEl.classList.remove('show');
  if (!name) { errEl.textContent = 'Project name is required.'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Creating…';

  try {
    const res = await authFetch('/api/platform/projects', {
      method: 'POST',
      body: JSON.stringify({ name, toolId: toolId || null, intent, integrationTargets: [...selectedIntegrations] }),
    });
    const data = await res.json();
    if (data.ok) {
      closeNewModal(); loadProjects();
    } else if (data.upgrade_url) {
      errEl.textContent = data.error; errEl.classList.add('show');
    } else {
      errEl.textContent = data.error || 'Failed to create project.'; errEl.classList.add('show');
    }
  } catch {
    errEl.textContent = 'Network error. Please try again.'; errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Create Project';
  }
}

async function init() {
  token = getToken();
  if (!token) { window.location.href = '/join?next=/projects'; return; }

  // Handle hash-based deep link (e.g. /projects#project-id)
  if (location.hash && location.hash.length > 1) {
    const id = location.hash.slice(1);
    openDetail(id);
  }

  loadProjects();
}

init();
</script>
<script src="/nav-routes.js"></script>
<script src="/bridge-nav.js"></script>
</body>
