<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Audit Dashboard — Bridge AI OS</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){body{font-size:15px}.desktop-only{display:none!important}}
@media(max-width:480px){body{font-size:14px}h1{font-size:1.5rem!important}h2{font-size:1.25rem!important}}
</style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700">
    <a href="/admin.html" class="text-xl font-bold text-orange-400">Bridge Audit</a>
    <div class="flex gap-4">
      <a href="/admin-command.html" class="text-slate-400 hover:text-orange-400">Commands</a>
      <a href="/settings.html" class="text-slate-400 hover:text-cyan-400">Settings</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-orange-400 mb-6">Bridge Audit Dashboard</h1>

    <div class="grid md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-cyan-400" id="txns">0</div>
        <div class="text-sm text-slate-400">Total Transactions</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-green-400" id="volume">$0</div>
        <div class="text-sm text-slate-400">Total Volume</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-yellow-400" id="pending">0</div>
        <div class="text-sm text-slate-400">Pending</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-red-400" id="flagged">0</div>
        <div class="text-sm text-slate-400">Flagged</div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
        <h2 class="text-lg font-bold text-orange-400 mb-4">Recent Transactions</h2>
        <div id="recentTx" class="space-y-2">
          <div class="text-slate-500">Loading...</div>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
        <h2 class="text-lg font-bold text-orange-400 mb-4">Flagged Transactions</h2>
        <div id="flaggedTx" class="space-y-2">
          <div class="text-slate-500">No flagged transactions</div>
        </div>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
      <h2 class="text-lg font-bold text-orange-400 mb-4">All Transactions</h2>
      <table class="w-full">
        <thead class="bg-slate-700">
          <tr>
            <th class="p-3 text-left">Hash</th>
            <th class="p-3 text-left">From</th>
            <th class="p-3 text-left">To</th>
            <th class="p-3 text-right">Amount</th>
            <th class="p-3 text-left">Status</th>
            <th class="p-3 text-left">Time</th>
          </tr>
        </thead>
        <tbody id="txTable">
          <tr><td colspan="6" class="p-4 text-center text-slate-500">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadAudit() {
      try {
        const res = await fetch('/api/audit');
        const data = await res.json();
        
        document.getElementById('txns').textContent = data.total || 0;
        document.getElementById('volume').textContent = '$' + (data.volume || 0).toLocaleString();
        document.getElementById('pending').textContent = data.pending || 0;
        document.getElementById('flagged').textContent = data.flagged || 0;

        const txns = data.transactions || [];
        
        if (txns.length === 0) {
          document.getElementById('txTable').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">No transactions</td></tr>';
        } else {
          document.getElementById('txTable').innerHTML = txns.map(t => `
            <tr class="border-t border-slate-700">
              <td class="p-3 font-mono text-cyan-400">${t.hash?.slice(0,10)}...</td>
              <td class="p-3 text-slate-400">${t.from?.slice(0,8)}...</td>
              <td class="p-3 text-slate-400">${t.to?.slice(0,8)}...</td>
              <td class="p-3 text-right text-green-400">$${t.amount}</td>
              <td class="p-3">
                <span class="px-2 py-1 rounded text-xs font-bold ${t.status === 'confirmed' ? 'bg-green-900 text-green-400' : t.status === 'flagged' ? 'bg-red-900 text-red-400' : 'bg-yellow-900 text-yellow-400'}">${t.status}</span>
              </td>
              <td class="p-3 text-slate-400">${t.time}</td>
            </tr>
          `).join('');
        }
      } catch(e) {
        document.getElementById('txTable').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-400">Error loading</td></tr>';
      }
    }

    loadAudit();
  </script>
<script src="/nav-routes.js"></script>
<script src="/bridge-nav.js"></script>
</body>
</html>
