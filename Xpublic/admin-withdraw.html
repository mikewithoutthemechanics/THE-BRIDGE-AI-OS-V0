<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Withdraw — Bridge AI OS</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700">
    <a href="/admin.html" class="text-xl font-bold text-orange-400">Admin Withdraw</a>
    <div class="flex gap-4">
      <a href="/admin-command.html" class="text-slate-400 hover:text-orange-400">Commands</a>
      <a href="/admin.html" class="text-slate-400 hover:text-orange-400">Panel</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-orange-400 mb-6">Withdrawal Management</h1>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-cyan-400" id="pending">0</div>
        <div class="text-sm text-slate-400">Pending</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-green-400" id="approved">0</div>
        <div class="text-sm text-slate-400">Approved (24h)</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div class="text-2xl font-bold text-red-400" id="rejected">0</div>
        <div class="text-sm text-slate-400">Rejected (24h)</div>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-6">
      <h2 class="text-lg font-bold text-orange-400 mb-4">Pending Withdrawals</h2>
      <table class="w-full">
        <thead class="bg-slate-700">
          <tr>
            <th class="p-3 text-left">ID</th>
            <th class="p-3 text-left">User</th>
            <th class="p-3 text-left">Amount</th>
            <th class="p-3 text-left">Method</th>
            <th class="p-3 text-left">Requested</th>
            <th class="p-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="withdrawals">
          <tr><td colspan="6" class="p-4 text-center text-slate-500">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
      <h2 class="text-lg font-bold text-orange-400 mb-4">Batch Actions</h2>
      <div class="flex gap-4">
        <button onclick="batchApprove()" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-500">
          Approve Selected
        </button>
        <button onclick="batchReject()" class="bg-red-600 text-white px-6 py-2 rounded font-bold hover:bg-red-500">
          Reject Selected
        </button>
      </div>
    </div>
  </main>

  <script>
    async function loadWithdrawals() {
      try {
        const res = await fetch('/api/admin/withdraw');
        const data = await res.json();
        const withdrawals = data.withdrawals || data || [];
        
        document.getElementById('pending').textContent = withdrawals.filter(w => w.status === 'pending').length;
        document.getElementById('approved').textContent = withdrawals.filter(w => w.status === 'approved').length;
        document.getElementById('rejected').textContent = withdrawals.filter(w => w.status === 'rejected').length;

        if (withdrawals.length === 0) {
          document.getElementById('withdrawals').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">No pending withdrawals</td></tr>';
        } else {
          document.getElementById('withdrawals').innerHTML = withdrawals.filter(w => w.status === 'pending').map(w => `
            <tr class="border-t border-slate-700">
              <td class="p-3 font-mono text-cyan-400">#${w.id}</td>
              <td class="p-3">${w.user}</td>
              <td class="p-3 text-green-400">$${w.amount}</td>
              <td class="p-3 text-slate-400">${w.method}</td>
              <td class="p-3 text-slate-400">${w.requested}</td>
              <td class="p-3">
                <button onclick="approve(${w.id})" class="text-green-400 hover:text-green-300 mr-2">Approve</button>
                <button onclick="reject(${w.id})" class="text-red-400 hover:text-red-300">Reject</button>
              </td>
            </tr>
          `).join('');
        }
      } catch(e) {
        document.getElementById('withdrawals').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-400">Error loading</td></tr>';
      }
    }

    async function approve(id) {
      await fetch('/api/admin/withdraw', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id, action: 'approve' })
      });
      loadWithdrawals();
    }

    async function reject(id) {
      await fetch('/api/admin/withdraw', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id, action: 'reject' })
      });
      loadWithdrawals();
    }

    function batchApprove() { alert('Select items to batch approve'); }
    function batchReject() { alert('Select items to batch reject'); }

    loadWithdrawals();
  </script>
</body>
</html>
