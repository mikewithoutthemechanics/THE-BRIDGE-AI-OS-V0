<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAN — Bridge Agent Network</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center">
    <a href="/" class="text-xl font-bold text-yellow-400">🌐 BAN</a>
    <div class="flex gap-4">
      <a href="/platforms.html" class="text-slate-400 hover:text-cyan-400">Platforms</a>
      <a href="/settings.html" class="text-slate-400 hover:text-cyan-400">Settings</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-yellow-400 mb-2">Bridge Agent Network</h1>
    <p class="text-slate-400 mb-8">Multi-objective task orchestration engine</p>

    <div class="grid md:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-cyan-400">71</div>
        <div class="text-sm text-slate-400">Active Agents</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-green-400">1,234</div>
        <div class="text-sm text-slate-400">Tasks Today</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-yellow-400">98%</div>
        <div class="text-sm text-slate-400">Success Rate</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-purple-400">12ms</div>
        <div class="text-sm text-slate-400">Avg Response</div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <div class="bg-slate-800 rounded-xl p-6">
        <h2 class="text-lg font-bold text-yellow-400 mb-4">Task Submission</h2>
        <textarea class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white" rows="4" placeholder="Describe your task..."></textarea>
        <button class="mt-4 bg-yellow-600 text-slate-900 px-6 py-2 rounded font-bold">Submit Task</button>
      </div>
      <div class="bg-slate-800 rounded-xl p-6">
        <h2 class="text-lg font-bold text-yellow-400 mb-4">Active Tasks</h2>
        <div class="space-y-2">
          <div class="bg-slate-700 p-3 rounded flex justify-between">
            <span>Data analysis</span>
            <span class="text-green-400">Running</span>
          </div>
          <div class="bg-slate-700 p-3 rounded flex justify-between">
            <span>Report generation</span>
            <span class="text-yellow-400">Pending</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
