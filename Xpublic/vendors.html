<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors — Bridge AI OS</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){body{font-size:15px}.desktop-only{display:none!important}}
@media(max-width:480px){body{font-size:14px}h1{font-size:1.5rem!important}h2{font-size:1.25rem!important}}
</style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center">
    <a href="/" class="text-xl font-bold text-cyan-400">Bridge AI OS</a>
    <div class="flex gap-4">
      <a href="/crm.html" class="text-slate-400 hover:text-cyan-400">CRM</a>
      <a href="/invoicing.html" class="text-slate-400 hover:text-cyan-400">Invoicing</a>
      <a href="/settings.html" class="text-slate-400 hover:text-cyan-400">Settings</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-cyan-400">Vendor Management</h1>
      <button onclick="addVendor()" class="bg-cyan-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-cyan-500">
        + Add Vendor
      </button>
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-cyan-400" id="total">0</div>
        <div class="text-sm text-slate-400">Total Vendors</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-green-400" id="active">0</div>
        <div class="text-sm text-slate-400">Active</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-yellow-400" id="pending">$0</div>
        <div class="text-sm text-slate-400">Pending Payments</div>
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl overflow-hidden">
      <table class="w-full">
        <thead class="bg-slate-700">
          <tr>
            <th class="p-4 text-left text-sm font-bold">Vendor</th>
            <th class="p-4 text-left text-sm font-bold">Category</th>
            <th class="p-4 text-left text-sm font-bold">Contact</th>
            <th class="p-4 text-left text-sm font-bold">Status</th>
            <th class="p-4 text-left text-sm font-bold">Total Spent</th>
            <th class="p-4 text-left text-sm font-bold">Actions</th>
          </tr>
        </thead>
        <tbody id="vendors-table">
          <tr><td colspan="6" class="p-8 text-center text-slate-500">Loading vendors...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadVendors() {
      try {
        const res = await fetch('/api/vendors');
        const data = await res.json();
        const vendors = data.vendors || data || [];
        
        document.getElementById('total').textContent = vendors.length;
        document.getElementById('active').textContent = vendors.filter(v => v.status === 'active').length;
        
        const total = vendors.reduce((sum, v) => sum + (v.pending || 0), 0);
        document.getElementById('pending').textContent = '$' + total.toLocaleString();

        if (vendors.length === 0) {
          document.getElementById('vendors-table').innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">No vendors found. Add your first vendor!</td></tr>';
        } else {
          document.getElementById('vendors-table').innerHTML = vendors.map(v => `
            <tr class="border-t border-slate-700 hover:bg-slate-750">
              <td class="p-4 font-bold">${v.name}</td>
              <td class="p-4 text-slate-400">${v.category || 'General'}</td>
              <td class="p-4 text-slate-400">${v.email || v.contact}</td>
              <td class="p-4">
                <span class="px-2 py-1 rounded text-xs font-bold ${v.status === 'active' ? 'bg-green-900 text-green-400' : 'bg-slate-600 text-slate-400'}">
                  ${v.status?.toUpperCase() || 'ACTIVE'}
                </span>
              </td>
              <td class="p-4 text-green-400">$${(v.spent || v.total || 0).toLocaleString()}</td>
              <td class="p-4">
                <button class="text-cyan-400 hover:text-cyan-300">View</button>
              </td>
            </tr>
          `).join('');
        }
      } catch(e) {
        document.getElementById('vendors-table').innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-400">Error loading vendors</td></tr>';
      }
    }

    function addVendor() {
      alert('Add vendor form would open here');
    }

    loadVendors();
  </script>
<script src="/nav-routes.js"></script>
<script src="/bridge-nav.js"></script>
</body>
</html>
