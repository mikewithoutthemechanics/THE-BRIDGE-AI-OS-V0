<section style="font-family:system-ui,sans-serif;color:#fff;">
  <style>
    .sa-ai{max-width:1000px;margin:0 auto;}
    .sa-ai h1{margin:0 0 0.5rem;color:#00c8ff;}
    .sa-ai .sub{color:#8aa;margin-bottom:1.5rem;}
    .sa-ai button{padding:0.5rem 1rem;background:#00c8ff;color:#0a1520;border:0;border-radius:6px;cursor:pointer;font-weight:600;margin-bottom:1rem;}
    .sa-sug{background:#1a2d40;border-left:4px solid #00c8ff;border-radius:6px;padding:1rem;margin-bottom:0.75rem;}
    .sa-sug.high{border-left-color:#f66;}
    .sa-sug.medium{border-left-color:#ffd166;}
    .sa-sug.low{border-left-color:#8ad;}
    .sa-sug.info{border-left-color:#00e57b;}
    .sa-sug-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;}
    .sa-sug-title{font-weight:600;color:#fff;}
    .sa-sug-tags{display:flex;gap:0.3rem;}
    .sa-chip{padding:2px 8px;border-radius:10px;font-size:0.65rem;font-weight:700;text-transform:uppercase;}
    .sa-chip.high{background:#f66;color:#0a1520;}
    .sa-chip.medium{background:#ffd166;color:#0a1520;}
    .sa-chip.low{background:#8ad;color:#0a1520;}
    .sa-chip.info{background:#00e57b;color:#0a1520;}
    .sa-chip.area{background:#2a4d60;color:#00c8ff;}
    .sa-sug-detail{color:#cde;font-size:0.88rem;line-height:1.4;}
    .sa-sug-action{margin-top:0.5rem;padding:0.5rem;background:#0e1c28;border-radius:4px;font-family:monospace;font-size:0.8rem;color:#ffd166;white-space:pre-wrap;word-break:break-all;}
  </style>

  <div class="sa-ai">
    <h1>🧠 AI Suggestions</h1>
    <div class="sub">System-health analysis. Heuristic review of runtime, config, RBAC, and reliability.</div>
    <button id="sa-ai-refresh">Re-analyze</button>

    <div id="sa-ai-list">
      <div style="text-align:center;padding:2rem;color:#8aa;">Analyzing…</div>
    </div>
  </div>
</section>

<script>
(function(){
  function getToken(){
    var m = document.cookie.match(/(?:^|;\s*)bridge_token=([^;]+)/);
    if(m) return decodeURIComponent(m[1]);
    try { return localStorage.getItem('bridge_token') || ''; } catch(_) { return ''; }
  }
  function authHeaders(){
    var t = getToken();
    return t ? { Authorization: 'Bearer ' + t } : {};
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  async function load(){
    var host = document.getElementById('sa-ai-list');
    host.innerHTML = '<div style="text-align:center;padding:2rem;color:#8aa;">Analyzing…</div>';
    try {
      var r = await fetch('https://bridge-ai-os.com/api/admin/ai-suggestions', { headers: authHeaders(), credentials: 'include' });
      if(!r.ok){
        host.innerHTML = '<div style="color:#f66;padding:1rem;">Access denied — superadmin required.</div>';
        return;
      }
      var data = await r.json();
      var list = data.suggestions || [];
      if(list.length === 0){
        host.innerHTML = '<div class="sa-sug info"><div class="sa-sug-title">All systems nominal ✓</div><div class="sa-sug-detail">No actionable issues detected at this time.</div></div>';
        return;
      }
      host.innerHTML = list.map(function(s){
        return '<div class="sa-sug ' + esc(s.severity) + '">'
          + '<div class="sa-sug-head">'
          +   '<div class="sa-sug-title">' + esc(s.title) + '</div>'
          +   '<div class="sa-sug-tags">'
          +     '<span class="sa-chip ' + esc(s.severity) + '">' + esc(s.severity) + '</span>'
          +     '<span class="sa-chip area">' + esc(s.area) + '</span>'
          +   '</div>'
          + '</div>'
          + '<div class="sa-sug-detail">' + esc(s.detail) + '</div>'
          + (s.action ? '<div class="sa-sug-action">▶ ' + esc(s.action) + '</div>' : '')
          + '</div>';
      }).join('');
    } catch(e){
      host.innerHTML = '<div style="color:#f66;padding:1rem;">Fetch failed: ' + esc(e.message) + '</div>';
    }
  }

  document.getElementById('sa-ai-refresh').addEventListener('click', load);
  load();
})();
</script>
