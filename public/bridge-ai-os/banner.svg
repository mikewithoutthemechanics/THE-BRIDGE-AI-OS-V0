<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="BRIDGE AI OS  autonomous infrastructure banner">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#5ad1ff"/>
    </linearGradient>
    <filter id="glow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="2" height="6">
      <rect width="2" height="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>
    <clipPath id="bannerClip"><rect width="880" height="320" rx="4"/></clipPath>
  </defs>

  <style>
    .font { font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace; }
    .title { font-weight: 700; letter-spacing: 0.18em; }
    .subtitle { font-size: 11px; fill: rgba(255,255,255,0.55); letter-spacing: 0.22em; }
    .tag { font-size: 15px; fill: #00f7ff; letter-spacing: 0.45em; filter: url(#glowStrong); }
    .st { font-size: 9.5px; letter-spacing: 0.06em; }
    .tk { font-size: 8.5px; fill: rgba(0,247,255,0.42); letter-spacing: 0.12em; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes sweep { 0% { transform: translateY(0); } 100% { transform: translateY(320px); } }
    .sweep { animation: sweep 4.2s linear infinite; }
  </style>

  <g clip-path="url(#bannerClip)">
    <rect width="880" height="320" fill="#05080f"/>
    <rect width="880" height="320" fill="#000" opacity="0.12"/>
    <rect width="880" height="320" fill="url(#scan)" opacity="0.22"/>

    <!-- Subtle grid -->
    <g opacity="0.045" stroke="#00f7ff" stroke-width="0.5" class="font">
      <line x1="0" y1="80" x2="880" y2="80"/><line x1="0" y1="160" x2="880" y2="160"/><line x1="0" y1="240" x2="880" y2="240"/>
      <line x1="220" y1="0" x2="220" y2="320"/><line x1="440" y1="0" x2="440" y2="320"/><line x1="660" y1="0" x2="660" y2="320"/>
    </g>

    <!-- Rising particles -->
    <g fill="#00f7ff">
      <circle cx="72" r="1.2" opacity="0">
        <animate attributeName="cy" from="325" to="-8" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.12;0.12;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="244" r="1" opacity="0">
        <animate attributeName="cy" from="325" to="-8" dur="11s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.08;0.08;0" dur="11s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="416" r="1.4" opacity="0">
        <animate attributeName="cy" from="325" to="-8" dur="7.5s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.14;0.14;0" dur="7.5s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="588" r="1" opacity="0">
        <animate attributeName="cy" from="325" to="-8" dur="10s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.09;0.09;0" dur="10s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" r="1.3" opacity="0">
        <animate attributeName="cy" from="325" to="-8" dur="8.2s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.11;0.11;0" dur="8.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Brand lockup: vector typography only -->
    <text class="font title" x="48" y="76" fill="url(#titleGrad)" font-size="44" filter="url(#glow)">BRIDGE</text>
    <text class="font title" x="48" y="122" fill="#00f7ff" font-size="30" filter="url(#glow)" letter-spacing="0.28em">AI OS</text>

    <line x1="48" y1="138" x2="400" y2="138" stroke="#00f7ff" stroke-width="0.5" opacity="0.28"/>
    <circle cx="440" cy="138" r="3" fill="#00f7ff" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="480" y1="138" x2="832" y2="138" stroke="#00f7ff" stroke-width="0.5" opacity="0.28"/>

    <text class="font tag" x="440" y="174" text-anchor="middle">BUILD " BRIDGE " DEPLOY</text>
    <text class="font subtitle" x="440" y="198" text-anchor="middle">AUTONOMOUS AI INFRASTRUCTURE  �  v2.1</text>

    <line x1="48" y1="212" x2="832" y2="212" stroke="#00f7ff" stroke-width="0.35" opacity="0.15"/>

    <!-- Status row -->
    <g class="font st">
      <circle cx="72" cy="228" r="4" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="86" y="232" fill="#00ff88">SYSTEM ONLINE</text>

      <circle cx="262" cy="228" r="4" fill="#00f7ff">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text x="276" y="232" fill="#00f7ff">AGENTS ORCHESTRATED</text>

      <circle cx="512" cy="228" r="4" fill="#ffcc33">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="526" y="232" fill="#ffcc33">GOD MODE</text>

      <circle cx="698" cy="228" r="4" fill="#ff6b6b">
        <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="712" y="232" fill="#ff6b6b">INFINITE SCALE</text>
    </g>

    <!-- Bottom bar + ticker -->
    <rect x="0" y="246" width="880" height="74" fill="rgba(5,12,22,0.82)"/>
    <line x1="0" y1="246" x2="880" y2="246" stroke="#00f7ff" stroke-width="0.5" opacity="0.22"/>

    <text class="font tk" y="268">
      <animate attributeName="x" from="900" to="-3200" dur="32s" repeatCount="indefinite"/>
      � BRIDGE AI OS  �  AUTONOMOUS AGENTS  �  INFRASTRUCTURE GRAPH  �  ORCHESTRATION  �  ZERO-TRUST EDGE  �  REAL-TIME SYNC  �  BUILD " BRIDGE " DEPLOY  �
    </text>
    <text class="font tk" y="288" opacity="0.2">
      <animate attributeName="x" from="-3000" to="900" dur="38s" repeatCount="indefinite"/>
      � NODE  �  EDGE  �  WEBSOCKET  �  POSTGRES  �  REDIS  �  VECTOR  �  SIWE  �  OBSERVABILITY  �
    </text>

    <!-- Scan sweep -->
    <rect x="0" y="0" width="880" height="4" fill="rgba(0,247,255,0.08)" class="sweep"/>
  </g>

  <rect x="1" y="1" width="878" height="318" fill="none" stroke="#00f7ff" stroke-width="1" opacity="0.18" rx="3"/>
</svg>
