<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="System Logs Viewer — Bridge AI OS. AI-powered business automation platform on Linea zkEVM.">
<meta name="robots" content="noindex, nofollow">

  <title>System Logs Viewer</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0d1620;
      color: #c8dce8;
      padding: 20px;
    }
    h1 {
      color: #00c8ff;
    }
    pre {
      background: #1a2332;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
    }
  </style>

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){
  body{font-size:15px}
  .desktop-only{display:none!important}
}
@media(max-width:480px){
  body{font-size:14px}
  h1{font-size:1.5rem!important}
  h2{font-size:1.25rem!important}
}
</style>
</head>
<body>
  <h1>System Logs</h1>
  <pre id="logs">Loading logs...</pre>

  <script>
    fetch('https://bridge-ai-os.com/api/logs')
      .then(res => res.text())
      .then(data => {
        document.getElementById('logs').innerText = data;
      })
      .catch(err => {
        document.getElementById('logs').innerText = 'Failed to load logs: ' + err.message;
      });
  </script>
<script src="/nav-routes.js"></script>
<script src="/bridge-nav.js"></script>
</body>
</html>
