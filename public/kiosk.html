<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosk — Bridge AI OS</title>
<meta name="description" content="Affiliate kiosk on Bridge AI OS.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050a0f;--s:#0d1620;--b:#1a2d40;--a:#00c8ff;--g:#00e57b;--r:#ff3c5a;--y:#ffd166;--p:#a78bfa;--o:#fb923c;--t:#c8dce8;--d:#4d6678}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
.nav{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#0a1520;border-bottom:1px solid var(--b);font-size:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.nav a{color:var(--d);text-decoration:none;padding:3px 6px;border:1px solid var(--b);border-radius:3px}
.nav a:hover{color:var(--a);border-color:var(--a)}
.cover{position:relative;min-height:240px;background:linear-gradient(180deg,#0a1520,var(--bg));padding:2.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--b)}
.cover img{max-height:140px;max-width:100%;border-radius:8px;margin-bottom:1rem}
.cover h1{color:var(--g);font-size:2rem;letter-spacing:.15em;margin-bottom:.4rem}
.cover .tag{color:var(--d);font-size:.9rem;max-width:600px;margin:0 auto}
.cover .who{font-size:.72rem;color:var(--a);margin-top:.8rem;letter-spacing:.1em}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.6rem;font-weight:600;letter-spacing:.1em}
.tier-gold{color:var(--y);background:rgba(255,209,102,.1)}
.tier-platinum{color:var(--p);background:rgba(167,139,250,.1)}
.tier-diamond{color:var(--a);background:rgba(0,200,255,.1)}
.tier-silver{color:var(--t);background:rgba(200,220,232,.1)}
.tier-bronze{color:var(--o);background:rgba(251,146,60,.1)}
.tier-starter{color:var(--d);background:rgba(77,102,120,.1)}
.section{max-width:1000px;margin:0 auto;padding:2rem 1.5rem}
h2{color:var(--a);font-size:1rem;letter-spacing:.15em;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.item{background:var(--s);border:1px solid var(--b);border-radius:8px;overflow:hidden;transition:border-color .2s;display:flex;flex-direction:column}
.item:hover{border-color:var(--g)}
.item img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#0a1520}
.item .body{padding:.9rem;flex:1;display:flex;flex-direction:column}
.item .type{font-size:.55rem;color:var(--d);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2rem}
.item h3{color:var(--t);font-size:.9rem;margin-bottom:.3rem;line-height:1.3}
.item .summary{color:var(--d);font-size:.75rem;flex:1;margin-bottom:.6rem}
.item .price{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.item .price .main{color:var(--g);font-weight:700;font-size:.95rem}
.item .price .alt{color:var(--d);font-size:.65rem}
.item .cta{display:block;margin-top:.6rem;padding:.5rem;background:var(--a);color:var(--bg);text-align:center;text-decoration:none;border-radius:4px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.item .cta:hover{filter:brightness(1.15)}
.empty{text-align:center;padding:3rem 1.5rem;color:var(--d);font-size:.85rem}
.footer{text-align:center;padding:2rem;border-top:1px solid var(--b);font-size:.6rem;color:var(--d)}
.footer a{color:var(--a);text-decoration:none}
.about{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:1.2rem;font-size:.8rem;color:var(--d);margin-bottom:2rem}
</style>

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){
  body{font-size:15px}
  .desktop-only{display:none!important}
}
@media(max-width:480px){
  body{font-size:14px}
  h1{font-size:1.5rem!important}
  h2{font-size:1.25rem!important}
}
</style>
</head>
<body>
<div class="nav">
  <a href="/">HOME</a><a href="/shop.html">SHOP</a><a href="/affiliate.html">AFFILIATE</a>
  <a id="owner-edit" href="/affiliate-portal/dashboard.html#/kiosk" style="display:none;margin-left:auto;color:var(--g);border-color:var(--g)">EDIT KIOSK</a>
</div>

<div class="cover" id="cover">
  <h1 id="k-title">Loading…</h1>
  <div class="tag" id="k-tagline"></div>
  <div class="who" id="k-who"></div>
</div>

<div class="section">
  <div id="about-wrap" style="display:none"><div class="about" id="k-about"></div></div>
  <h2 id="listings-title">LISTINGS</h2>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">This kiosk has no listings yet.</div>
</div>

<div class="footer">
  Kiosk hosted on <a href="/">Bridge AI OS</a> | <a href="/shop.html">Browse all affiliates</a>
</div>

<script>
const slug = location.pathname.replace(/^\/k\//, '').replace(/\/$/, '') || '';
const tierClass = t => 'tier-' + (t || 'starter');
function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function priceLabel(l){
  const c = l.currency_preferred || (l.price_zar != null ? 'ZAR' : l.price_usd != null ? 'USD' : 'BRDG');
  const main = l.price_zar != null ? `R${l.price_zar}` : l.price_usd != null ? `$${l.price_usd}` : l.price_brdg != null ? `${l.price_brdg} BRDG` : '—';
  const alts = [];
  if (c !== 'ZAR' && l.price_zar != null) alts.push(`R${l.price_zar}`);
  if (c !== 'USD' && l.price_usd != null) alts.push(`$${l.price_usd}`);
  if (c !== 'BRDG' && l.price_brdg != null) alts.push(`${l.price_brdg} BRDG`);
  return { main, alts: alts.join(' · ') };
}

async function load() {
  const r = await fetch(`/api/kiosk/${encodeURIComponent(slug)}`).catch(() => null);
  if (!r || !r.ok) {
    document.getElementById('k-title').textContent = 'KIOSK NOT FOUND';
    document.getElementById('k-tagline').textContent = 'This kiosk is unpublished or the link is wrong.';
    return;
  }
  const d = await r.json();
  if (!d.ok) return;

  const k = d.kiosk;
  const aff = d.affiliate;
  document.title = `${k.title} — Bridge AI OS`;
  document.getElementById('k-title').textContent = k.title || `${aff.name}'s Kiosk`;
  document.getElementById('k-tagline').textContent = k.tagline || '';

  const who = document.getElementById('k-who');
  who.innerHTML = `by <strong>${esc(aff.name)}</strong> &nbsp; <span class="badge ${tierClass(aff.tier)}">${(aff.tier||'starter').toUpperCase()}</span>`;

  if (k.cover_image_url) {
    const img = document.createElement('img');
    img.src = k.cover_image_url;
    img.alt = k.title || '';
    document.getElementById('cover').insertBefore(img, document.getElementById('k-title'));
  }
  if (k.accent_color) {
    document.documentElement.style.setProperty('--g', k.accent_color);
  }

  if (k.about_html) {
    document.getElementById('about-wrap').style.display = '';
    // Safe: about_html is written by owner via authenticated PATCH; we sanitize
    // by restricting to textContent unless we add DOMPurify.
    document.getElementById('k-about').textContent = String(k.about_html).replace(/<[^>]*>/g, '').slice(0, 4000);
  }

  const grid = document.getElementById('grid');
  grid.textContent = '';
  if (!d.listings || !d.listings.length) {
    document.getElementById('empty').style.display = '';
    return;
  }
  d.listings.forEach(l => {
    const card = document.createElement('article');
    card.className = 'item';
    const img = document.createElement('div');
    if (l.image_url) {
      const im = document.createElement('img');
      im.src = l.image_url;
      im.alt = l.title;
      im.loading = 'lazy';
      card.appendChild(im);
    }
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `
      <div class="type">${esc(l.type)}</div>
      <h3>${esc(l.title)}</h3>
      <div class="summary">${esc(l.summary || '')}</div>
    `;
    const p = priceLabel(l);
    const priceWrap = document.createElement('div');
    priceWrap.className = 'price';
    priceWrap.innerHTML = `<span class="main">${esc(p.main)}</span><span class="alt">${esc(p.alts)}</span>`;
    body.appendChild(priceWrap);

    const cta = document.createElement('a');
    cta.className = 'cta';
    if (l.type === 'referral_link' && l.external_url) {
      cta.href = l.external_url;
      cta.target = '_blank';
      cta.rel = 'noopener sponsored';
      cta.textContent = 'OPEN PARTNER';
    } else {
      cta.href = `/shop.html#/buy/${l.id}?ref=${encodeURIComponent(aff.referral_code)}`;
      cta.textContent = l.price_brdg != null ? 'BUY WITH BRDG' : 'BUY NOW';
    }
    body.appendChild(cta);
    card.appendChild(body);
    grid.appendChild(card);
  });

  // Show owner edit link if logged-in user is the kiosk owner
  const token = localStorage.getItem('bridge_token');
  if (token) {
    fetch('https://bridge-ai-os.com/api/kiosk/mine', { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.ok ? r.json() : null)
      .then(mine => {
        if (mine && mine.kiosk && mine.kiosk.id === k.id) {
          document.getElementById('owner-edit').style.display = '';
        }
      })
      .catch(() => {});
  }
}

load();
</script>
<script src="/nav-routes.js"></script>
<script src="/bridge-nav.js"></script>
</body>
</html>
