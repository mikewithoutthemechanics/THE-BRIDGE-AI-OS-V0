<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="description" content="Signing in — Bridge AI OS. AI-powered business automation platform on Linea zkEVM.">
<meta name="robots" content="noindex, nofollow">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in — Bridge AI OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 360px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c6af7, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(124, 106, 247, 0.2);
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message {
      font-size: 1rem;
      color: #a0a0c0;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.8rem;
      color: #606080;
    }
    .error-box {
      display: none;
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Bridge AI OS</div>
    <div class="spinner" id="spinner"></div>
    <p class="message" id="message">Signing you in...</p>
    <p class="sub" id="sub">Please wait while we complete your authentication.</p>
    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (async function () {
      const SUPER_ADMIN_EMAIL = 'ryanpcowan@gmail.com';
      const params  = new URLSearchParams(window.location.search);
      const hash    = new URLSearchParams(window.location.hash.replace('#', ''));

      // Supabase PKCE flow returns `code` in the query string.
      // Implicit flow returns tokens in the hash.
      const code         = params.get('code');
      const accessToken  = hash.get('access_token') || params.get('access_token');
      const errorParam   = params.get('error') || hash.get('error');
      const errorDesc    = params.get('error_description') || hash.get('error_description') || '';

      // Pass wizard state through to the final redirect
      const wizard   = params.get('wizard')   || '';
      const intent   = params.get('intent')   || '';
      const industry = params.get('industry') || '';
      const plan     = params.get('plan')     || '';
      const nextPath = params.get('next')     || '';

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('message').textContent = 'Authentication failed';
        document.getElementById('sub').textContent = 'Redirecting you back...';
        const box = document.getElementById('errorBox');
        box.textContent = msg;
        box.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/join?error=oauth_failed';
        }, 2000);
      }

      function isSuperAdminUser(user) {
        const email = user && user.email ? String(user.email).trim().toLowerCase() : '';
        return email === SUPER_ADMIN_EMAIL;
      }

      function getSafeNextPath(raw) {
        const p = String(raw || '');
        if (!p) return '';
        if (!p.startsWith('/')) return '';
        if (p.startsWith('//')) return '';
        if (p.startsWith('/auth-callback')) return '';
        return p;
      }

      function handleSuccess(token, user) {
        if (token) localStorage.setItem('bridge_token', token);
        if (user)  localStorage.setItem('bridge_user', JSON.stringify(user));

        document.getElementById('message').textContent = 'Welcome, ' + (user?.name || user?.email || 'there') + '!';
        document.getElementById('sub').textContent = 'Redirecting you now...';

        // Decide where to send the user
        let dest = '/dashboard';
        const safeNext = getSafeNextPath(nextPath);
        if (safeNext) {
          dest = safeNext;
        } else if (isSuperAdminUser(user)) {
          // Guaranteed override for super admin routing.
          dest = '/admin/dashboard';
        } else if (wizard === '1') {
          dest = '/wizard';
          const qs = new URLSearchParams();
          if (intent)   qs.set('intent',   intent);
          if (industry) qs.set('industry', industry);
          if (plan)     qs.set('plan',     plan);
          if (qs.toString()) dest += '?' + qs.toString();
        } else if (plan && plan !== 'free') {
          dest = '/checkout?plan=' + encodeURIComponent(plan);
        } else {
          dest = '/profile';
        }

        setTimeout(() => { window.location.href = dest; }, 800);
      }

      // Error from OAuth provider
      if (errorParam) {
        return showError(decodeURIComponent(errorDesc) || errorParam);
      }

      // ── PKCE flow: exchange code for session ─────────────────────────────
      if (code) {
        document.getElementById('message').textContent = 'Verifying your account…';
        document.getElementById('sub').textContent = 'Almost done.';
        try {
          const resp = await fetch('/auth/exchange-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });
          const data = await resp.json();
          if (!resp.ok || !data.ok) {
            return showError(data.error || 'Sign-in failed. Please try again.');
          }
          document.getElementById('message').textContent = 'Welcome!';
          document.getElementById('sub').textContent = 'Redirecting you now…';
          return handleSuccess(data.token, data.user);
        } catch (err) {
          return showError('Network error during sign-in. Please try again.');
        }
      }

      // ── Implicit flow: token already in hash ─────────────────────────────
      if (accessToken) {
        // Store Supabase access token directly; the server already set the cookie via exchange-code,
        // but for implicit flow we just store it locally and redirect.
        localStorage.setItem('bridge_token', accessToken);
        const user = {};
        try {
          // Decode JWT payload (no verification — just for display)
          const b64 = accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          const p = JSON.parse(atob(b64));
          user.email = p.email || '';
          user.id    = p.sub   || '';
        } catch (_) { /* ignore */ }
        return handleSuccess(accessToken, user);
      }

      // Nothing to work with — redirect back
      showError('No authentication data received.');
    })();
  </script>
</body>
</html>
