  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIDGE AI OS — Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050a0f;
      --surface: #0d1620;
      --border: #1a2d40;
      --accent: #00c8ff;
      --green: #00e57b;
      --red: #ff3c5a;
      --yellow: #ffd166;
      --text: #c8dce8;
      --text-dim: #4d6678;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .toolbar a:hover { color: var(--accent); border-color: var(--accent); }
    .toolbar .title { font-size: 0.8rem; color: var(--accent); letter-spacing: 0.15em; flex: 1; }
    .toolbar .status { font-size: 0.7rem; color: var(--text-dim); }

    .tabs {
      display: flex;
      gap: 0;
      background: #080e16;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      color: var(--text-dim);
      cursor: pointer;
      border-right: 1px solid var(--border);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .tab.active { color: var(--accent); background: var(--surface); border-bottom: 2px solid var(--accent); }
    .tab .close-btn {
      font-size: 0.6rem;
      cursor: pointer;
      opacity: 0.5;
    }
    .tab .close-btn:hover { opacity: 1; color: var(--red); }

    .btn-new {
      padding: 0.4rem 0.8rem;
      font-size: 0.7rem;
      color: var(--green);
      cursor: pointer;
      letter-spacing: 0.1em;
      border: none;
      background: none;
      font-family: inherit;
    }
    .btn-new:hover { text-shadow: 0 0 8px var(--green); }
    .btn-new:disabled { color: var(--text-dim); cursor: not-allowed; }

    .terminal-container {
      flex: 1;
      position: relative;
    }
    .term-wrapper {
      position: absolute;
      inset: 0;
      display: none;
      padding: 4px;
    }
    .term-wrapper.active { display: block; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    .reconnect-banner {
      display: none;
      padding: 0.4rem 1rem;
      background: rgba(255, 60, 90, 0.15);
      border-bottom: 1px solid var(--red);
      font-size: 0.72rem;
      color: var(--yellow);
      text-align: center;
    }
    .reconnect-banner.show { display: block; }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <a href="/">&#8592; DASHBOARD</a>
    <div class="title">TERMINAL</div>
    <div class="status" id="conn-status">CONNECTING...</div>
  </div>
  <div id="reconnect-banner" class="reconnect-banner">Connection lost. Reconnecting...</div>
  <div class="tabs" id="tab-bar">
    <button class="btn-new" id="btn-new-tab">+ NEW TAB</button>
  </div>
  <div class="terminal-container" id="terminal-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
  const MAX_TABS = 4;
  const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const IS_SERVERLESS = location.hostname.includes('vercel.app') || location.hostname.includes('.vercel.');

  // Production: connect to same host on /terminal path (system.js WS endpoint)
  // Local: try system.js on :3000/terminal first (full PTY), fall back to proxy on :5002
  const WS_URL = IS_LOCAL
    ? `${WS_PROTO}//localhost:${location.port || 3000}/terminal`
    : `${WS_PROTO}//${location.host}/terminal`;

  const tabs = [];
  let activeTab = -1;

  function createTab() {
    if (tabs.length >= MAX_TABS) return;
    const idx = tabs.length;
    const id = `term-${idx}`;

    // Terminal wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'term-wrapper';
    wrapper.id = id;
    document.getElementById('terminal-container').appendChild(wrapper);

    // xterm instance
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: "'Courier New', monospace",
      theme: {
        background: '#050a0f',
        foreground: '#c8dce8',
        cursor: '#00c8ff',
        selectionBackground: '#1a2d40',
        black: '#050a0f',
        green: '#00e57b',
        cyan: '#00c8ff',
        red: '#ff3c5a',
        yellow: '#ffd166',
      }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(wrapper);
    fitAddon.fit();

    // Tab button
    const tabBtn = document.createElement('div');
    tabBtn.className = 'tab';
    tabBtn.innerHTML = `<span>TERM ${idx + 1}</span><span class="close-btn" data-idx="${idx}">x</span>`;
    tabBtn.dataset.idx = idx;
    const newBtn = document.getElementById('btn-new-tab');
    newBtn.parentElement.insertBefore(tabBtn, newBtn);

    tabBtn.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-btn')) {
        closeTab(parseInt(e.target.dataset.idx));
      } else {
        switchTab(idx);
      }
    });

    // Tab state — protocol auto-detected on first server response
    // 'pty' = system.js (full PTY), 'proxy' = terminal-proxy.js (whitelist exec)
    const tab = { term, fitAddon, wrapper, tabBtn, ws: null, alive: true, retries: 0, protocol: null, sessionId: null };
    tabs.push(tab);

    if (IS_SERVERLESS) {
      showServerlessMessage(term);
      document.getElementById('conn-status').textContent = 'SERVERLESS';
      document.getElementById('conn-status').style.color = '#ffd166';
    } else {
      connectTab(idx);
    }
    switchTab(idx);

    // Input — routed based on detected protocol
    term.onData(data => handleTerminalInput(tab, data));

    // Resize
    term.onResize(({ cols, rows }) => {
      if (tab.ws && tab.ws.readyState === WebSocket.OPEN) {
        const msg = { type: 'resize', cols, rows };
        if (tab.sessionId) msg.sessionId = tab.sessionId;
        tab.ws.send(JSON.stringify(msg));
      }
    });
    window.addEventListener('resize', () => fitAddon.fit());

    updateNewBtn();
  }

  function connectTab(idx) {
    const tab = tabs[idx];
    if (!tab) return;

    const ws = new WebSocket(WS_URL);
    tab.ws = ws;
    tab.protocol = null;
    tab.sessionId = null;

    ws.onopen = () => {
      tab.retries = 0;
      document.getElementById('conn-status').textContent = 'AUTHENTICATING...';
      document.getElementById('conn-status').style.color = '#ffd166';
      document.getElementById('reconnect-banner').classList.remove('show');

      // Send JWT — both system.js and terminal-proxy.js accept this
      const token = localStorage.getItem('bridge_token') || '';
      ws.send(JSON.stringify({ type: 'auth', token }));
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) {
        // Raw binary/text passthrough
        tab.term.write(e.data);
        return;
      }

      switch (msg.type) {
        // ── system.js PTY protocol ──────────────────────────────────────
        case 'auth_ok': {
          tab.protocol = 'pty';
          setConnected(`PTY (${msg.user || 'operator'})`);
          tab.term.writeln(`\x1b[32m[Authenticated]\x1b[0m  User: ${msg.user || 'operator'}  Role: ${msg.role || 'user'}  Mode: PTY`);
          tab.term.writeln('');

          // Spawn a PTY session immediately
          tab.sessionId = 'term-' + idx + '-' + Date.now();
          const { cols, rows } = tab.fitAddon.proposeDimensions() || { cols: 120, rows: 30 };
          ws.send(JSON.stringify({ type: 'create', sessionId: tab.sessionId, cols, rows }));
          break;
        }

        case 'auth_fail': {
          tab.term.writeln(`\r\n\x1b[31m[AUTH FAILED] ${msg.error}\x1b[0m`);
          document.getElementById('conn-status').textContent = 'AUTH FAILED';
          document.getElementById('conn-status').style.color = '#ff3c5a';
          break;
        }

        case 'ready':
        case 'created': {
          // PTY session created — terminal is live
          tab.term.writeln('\x1b[2m[PTY session ready]\x1b[0m\r\n');
          break;
        }

        // ── terminal-proxy.js whitelist protocol ────────────────────────
        case 'init': {
          tab.protocol = 'proxy';
          setConnected('WHITELIST');
          const cmds = (msg.commands || []).map(c => `\x1b[32m${c.key}\x1b[0m`).join('  ');
          tab.term.writeln('\x1b[32m[Authenticated]\x1b[0m  Available: ' + cmds);
          tab.term.writeln('\x1b[2mType a command key and press Enter\x1b[0m\r\n');
          tab.term.write('\x1b[32m> \x1b[0m');
          break;
        }

        // ── Shared message types ────────────────────────────────────────
        case 'output': {
          tab.term.write(msg.data);
          break;
        }

        case 'done': {
          tab.term.writeln(`\r\n\x1b[2m[exit ${msg.code}]\x1b[0m`);
          if (tab.protocol === 'proxy') tab.term.write('\x1b[32m> \x1b[0m');
          break;
        }

        case 'exit': {
          tab.term.writeln(`\r\n\x1b[33m[Session ended — code ${msg.code}]\x1b[0m`);
          tab.sessionId = null;
          break;
        }

        case 'error': {
          tab.term.writeln(`\r\n\x1b[31m[ERROR] ${msg.message}\x1b[0m`);
          if (msg.message === 'Auth timeout' || msg.message === 'Invalid token') {
            document.getElementById('conn-status').textContent = 'AUTH FAILED';
            document.getElementById('conn-status').style.color = '#ff3c5a';
          }
          break;
        }

        case 'connected':
          tab.term.writeln('\x1b[32m[Connected]\x1b[0m\r\n');
          break;

        case 'pty-closed':
          tab.term.writeln('\r\n\x1b[33m[Session ended]\x1b[0m');
          tab.sessionId = null;
          break;

        case 'session':
        case 'monitor':
          break; // ignored

        default:
          // Unknown message — show as raw output if it has data
          if (msg.data) tab.term.write(msg.data);
          break;
      }
    };

    ws.onclose = () => {
      document.getElementById('conn-status').textContent = 'DISCONNECTED';
      document.getElementById('conn-status').style.color = '#ff3c5a';
      document.getElementById('reconnect-banner').classList.add('show');
      tab.sessionId = null;
      const delay = Math.min(1000 * Math.pow(2, tab.retries), 30000);
      tab.retries++;
      setTimeout(() => {
        if (tabs[idx] && tabs[idx] === tab) connectTab(idx);
      }, delay);
    };

    ws.onerror = () => {};
  }

  function setConnected(mode) {
    document.getElementById('conn-status').textContent = 'CONNECTED (' + mode + ')';
    document.getElementById('conn-status').style.color = '#00e57b';
  }

  // Route input based on detected protocol
  function handleTerminalInput(tab, data) {
    if (!tab.ws || tab.ws.readyState !== WebSocket.OPEN) return;

    if (tab.protocol === 'pty' && tab.sessionId) {
      // Full PTY mode — send raw keystrokes directly
      tab.ws.send(JSON.stringify({ type: 'input', sessionId: tab.sessionId, data }));
    } else if (tab.protocol === 'proxy') {
      // Whitelist mode — buffer into command line, send on Enter
      if (!tab._lineBuf) tab._lineBuf = '';
      if (data === '\r' || data === '\n') {
        const cmd = tab._lineBuf.trim();
        tab._lineBuf = '';
        tab.term.writeln('');
        if (cmd) tab.ws.send(JSON.stringify({ type: 'exec', command: cmd }));
        else tab.term.write('\x1b[32m> \x1b[0m');
      } else if (data === '\x7f') {
        if (tab._lineBuf.length > 0) {
          tab._lineBuf = tab._lineBuf.slice(0, -1);
          tab.term.write('\b \b');
        }
      } else {
        tab._lineBuf += data;
        tab.term.write(data);
      }
    }
    // If protocol not yet detected, buffer nothing — wait for auth response
  }

  function switchTab(idx) {
    tabs.forEach((t, i) => {
      t.wrapper.classList.toggle('active', i === idx);
      t.tabBtn.classList.toggle('active', i === idx);
    });
    activeTab = idx;
    if (tabs[idx]) tabs[idx].fitAddon.fit();
  }

  function closeTab(idx) {
    const tab = tabs[idx];
    if (!tab) return;
    if (tabs.length <= 1) return;
    try { tab.ws.close(); } catch (_) {}
    tab.wrapper.remove();
    tab.tabBtn.remove();
    tabs[idx] = null;
    const next = tabs.findIndex(t => t !== null);
    if (next >= 0) switchTab(next);
    updateNewBtn();
  }

  function updateNewBtn() {
    const live = tabs.filter(t => t !== null).length;
    document.getElementById('btn-new-tab').disabled = live >= MAX_TABS;
  }

  function showServerlessMessage(term) {
    const C = '\x1b[36m', G = '\x1b[32m', Y = '\x1b[1;33m', W = '\x1b[1;37m';
    const M = '\x1b[35m', D = '\x1b[2;36m', R = '\x1b[0m';
    term.writeln('');
    term.writeln(`${C}    ____       _     __              ___    ____   ____  _____${R}`);
    term.writeln(`${C}   / __ )_____(_)___/ /___ ____     /   |  /  _/  / __ \\/ ___/${R}`);
    term.writeln(`${C}  / __  / ___/ / __  / __ \`/ _ \\   / /| |  / /   / / / /\\__ \\ ${R}`);
    term.writeln(`${C} / /_/ / /  / / /_/ / /_/ /  __/  / ___ |_/ /   / /_/ /___/ / ${R}`);
    term.writeln(`${C}/_____/_/  /_/\\__,_/\\__, /\\___/  /_/  |_/___/   \\____//____/  ${R}`);
    term.writeln(`${C}                   /____/                                      ${R}`);
    term.writeln('');
    term.writeln(`${D}  ┌─────────────────────────────────────────────────────────┐${R}`);
    term.writeln(`${D}  │${R}  ${Y}UNIFIED COMMAND CENTER${R}        ${G}v3.0.0${R}   ${D}│${R}`);
    term.writeln(`${D}  │${R}  ${W}Multi-Agent Orchestration Framework${R}               ${D}│${R}`);
    term.writeln(`${D}  └─────────────────────────────────────────────────────────┘${R}`);
    term.writeln('');
    term.writeln(`${M}  [!]${R}  PTY terminal requires a persistent server.`);
    term.writeln(`${M}  [!]${R}  WebSocket not available in serverless mode.`);
    term.writeln('');
    term.writeln(`${G}  Connect via VPS:${R}  ${W}https://go.ai-os.co.za/terminal/terminal.html${R}`);
    term.writeln('');
  }

  document.getElementById('btn-new-tab').addEventListener('click', createTab);

  // Start with one tab
  createTab();
</script>
</body>
</html>
