<!DOCTYPE html>
<html lang="en">
<head>

  <title>Aurora — AI Assistant</title>
  <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style id="bridge-mobile-base">
*{box-sizing:border-box}
body{margin:0;padding:0;overflow-x:hidden}
img,video,iframe,table{max-width:100%}
@media(max-width:820px){
  body{font-size:15px}
  .desktop-only{display:none!important}
}
@media(max-width:480px){
  body{font-size:14px}
  h1{font-size:1.5rem!important}

}

<body class="bg-slate-900 text-slate-200 min-h-screen">
  <nav class="bg-slate-800 p-4 flex justify-between items-center">
    <a href="/" class="text-xl font-bold text-purple-400">✨ Aurora</a>
    <div class="flex gap-4">
      <a href="/platforms.html" class="text-slate-400 hover:text-cyan-400">Platforms</a>
      <a href="/settings.html" class="text-slate-400 hover:text-cyan-400">Settings</a>

  <main class="max-w-6xl mx-auto p-6">

        <p class="text-slate-400 text-sm">Text-to-speech with emotions</p>
      </a>
      <a href="/voice.html" class="bg-slate-800 p-6 rounded-xl hover:bg-slate-700">
        <div class="text-3xl mb-2">🎤</div>
        <h3 class="text-lg font-bold text-cyan-400">Voice AI</h3>
        <p class="text-slate-400 text-sm">Voice conversations</p>
