<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge AI - Workspace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #09090f; color: #e0e0e0; min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background: #0f0f1a; padding: 20px; border-right: 1px solid #1f1f2e; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #00d4ff; padding: 10px 0 30px; }
        .nav-item { padding: 12px 15px; border-radius: 8px; color: #888; cursor: pointer; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.active { background: #1a1a2e; color: #fff; }
        .nav-item span { margin-right: 10px; }
        .main { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .header h1 { font-size: 1.8rem; }
        .btn { background: #00d4ff; color: #000; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { background: #14141f; padding: 20px; border-radius: 10px; border: 1px solid #1f1f2e; }
        .card .value { font-size: 2rem; font-weight: 700; color: #fff; }
        .card .label { color: #666; font-size: 0.85rem; margin-top: 5px; }
        .chart { background: #14141f; padding: 25px; border-radius: 10px; height: 300px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        .tool { padding: 8px 16px; background: #1a1a2e; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
        .tool:hover { background: #252535; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🤖 Workspace</div>
        <div class="nav-item active"><span>📊</span> Dashboard</div>
        <div class="nav-item"><span>💼</span> Projects</div>
        <div class="nav-item"><span>🤖</span> Agents</div>
        <div class="nav-item"><span>📁</span> Files</div>
        <div class="nav-item"><span>🔌</span> Integrations</div>
        <div class="nav-item"><span>💰</span> Revenue</div>
        <div class="nav-item"><span>⚙️</span> Settings</div>
    </div>
    <div class="main">
        <div class="header">
            <h1>Welcome back! 👋</h1>
            <button class="btn">+ New Project</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="value" id="apiCalls">24.5K</div>
                <div class="label">API Calls Today</div>
            </div>
            <div class="card">
                <div class="value" id="activeAgents">8</div>
                <div class="label">Active Agents</div>
            </div>
            <div class="card">
                <div class="value" id="brdgBalance">3,420</div>
                <div class="label">BRDG Balance</div>
            </div>
            <div class="card">
                <div class="value" id="uptime">99.9%</div>
                <div class="label">System Uptime</div>
            </div>
        </div>
        
        <div class="toolbar">
            <div class="tool">All Activity</div>
            <div class="tool">API Calls</div>
            <div class="tool">Agent Tasks</div>
            <div class="tool">Revenue</div>
        </div>
        
        <div class="chart">
            <h3 style="margin-bottom:15px">📈 Activity Overview</h3>
            <div style="display:flex;align-items:flex-end;height:200px;gap:8px;">
                <div style="width:30px;height:60%;background:#1a1a2e;border-radius:4px;"></div>
                <div style="width:30px;height:80%;background:#1a1a2e;border-radius:4px;"></div>
                <div style="width:30px;height:45%;background:#1a1a2e;border-radius:4px;"></div>
                <div style="width:30px;height:90%;background:#1a1a2e;border-radius:4px;"></div>
                <div style="width:30px;height:70%;background:#00d4ff;border-radius:4px;"></div>
                <div style="width:30px;height:85%;background:#1a1a2e;border-radius:4px;"></div>
                <div style="width:30px;height:55%;background:#1a1a2e;border-radius:4px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
