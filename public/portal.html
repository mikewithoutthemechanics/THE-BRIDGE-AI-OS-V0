<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal — Bridge AI OS</title>
<meta name="description" content="Your personalized client dashboard for Bridge AI OS.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0a0e17;--card:#131a2b;--cyan:#38bdf8;--green:#22c55e;--orange:#f59e0b;--purple:#a78bfa;--dim:#6b7280;--red:#ef4444;--border:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#e2e8f0;font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding-bottom:80px}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}

.container{max-width:1100px;margin:0 auto;padding:24px}
@media(max-width:640px){.container{padding:14px}}

/* Welcome header */
.welcome-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.welcome-left h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.welcome-left .sub{font-size:.82rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.plan-starter{background:rgba(56,189,248,.12);color:var(--cyan)}
.plan-pro{background:rgba(167,139,250,.14);color:var(--purple)}
.plan-admin{background:rgba(34,197,94,.12);color:var(--green)}
.plan-enterprise{background:rgba(245,158,11,.12);color:var(--orange)}
.plan-free{background:rgba(255,255,255,.06);color:var(--dim)}
.brdg-balance{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-weight:600}
.brdg-icon{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#0a0e17}

/* Funnel indicator */
.funnel-indicator{display:flex;gap:4px;margin-top:8px}
.funnel-step{height:4px;flex:1;border-radius:2px;background:var(--border);max-width:60px}
.funnel-step.active{background:var(--cyan)}
.funnel-label{font-size:.65rem;color:var(--dim);margin-top:4px}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.stat-icon{font-size:1.3rem;margin-bottom:8px}
.stat-value{font-size:1.8rem;font-weight:800;color:var(--cyan);margin-bottom:2px}
.stat-label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

/* Quick actions */
.quick-actions{display:flex;gap:10px;margin-bottom:32px;flex-wrap:wrap}
.action-btn{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.8rem;font-weight:600;color:#e2e8f0;cursor:pointer;transition:all .15s;text-decoration:none}
.action-btn:hover{border-color:var(--cyan);color:var(--cyan);text-decoration:none}

/* Projects section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:1rem;font-weight:700}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:32px}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:border-color .2s}
.project-card:hover{border-color:rgba(56,189,248,.3)}
.project-name{font-size:.9rem;font-weight:600;margin-bottom:4px}
.project-meta{font-size:.72rem;color:var(--dim);margin-bottom:10px}
.project-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.status-active{background:rgba(34,197,94,.1);color:var(--green)}
.status-completed{background:rgba(56,189,248,.1);color:var(--cyan)}
.status-archived{background:rgba(255,255,255,.05);color:var(--dim)}
.project-actions{display:flex;gap:6px;margin-top:10px}
.project-btn{padding:6px 12px;border-radius:6px;font-size:.7rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer}
.project-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.project-btn-run{border-color:var(--green);color:var(--green)}
.new-project-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer}
.new-project-card:hover{border-color:var(--cyan)}
.new-icon{width:40px;height:40px;border-radius:50%;background:rgba(56,189,248,.1);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--cyan)}

/* Activity feed */
.activity-feed{margin-bottom:32px}
.activity-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.activity-dot-project{background:var(--cyan)}
.activity-dot-invoice{background:var(--orange)}
.activity-dot-ticket{background:var(--purple)}
.activity-dot-login{background:var(--green)}
.activity-content{flex:1}
.activity-text{font-size:.82rem;margin-bottom:2px}
.activity-time{font-size:.7rem;color:var(--dim)}
.empty-state{text-align:center;padding:24px;color:var(--dim);font-size:.82rem;border:1px dashed var(--border);border-radius:8px}

/* Newsletter modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10000;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:400px;width:90%;text-align:center}
.modal-title{font-size:1.2rem;font-weight:700;margin-bottom:8px}
.modal-desc{font-size:.82rem;color:var(--dim);margin-bottom:20px}
.modal-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:#e2e8f0;font-size:.88rem;margin-bottom:12px}
.modal-input:focus{outline:none;border-color:var(--cyan)}
.modal-btn{width:100%;padding:12px;background:var(--cyan);color:#0a0e17;border:none;border-radius:8px;font-weight:700;font-size:.88rem;cursor:pointer;margin-bottom:8px}
.modal-btn:hover{opacity:.9}
.modal-dismiss{font-size:.78rem;color:var(--dim);cursor:pointer;border:none;background:none;font-family:inherit}
.modal-dismiss:hover{color:#e2e8f0}
.modal-msg{font-size:.75rem;color:var(--green);margin-top:8px;min-height:1.2em}
</style>
</head>
<body>

<div class="container">
  <!-- Welcome -->
  <div class="welcome-bar">
    <div class="welcome-left">
      <h1 id="welcomeHeading">Welcome back</h1>
      <div class="sub">
        <span class="plan-badge plan-free" id="portalPlanBadge">--</span>
        <span id="portalEmail"></span>
      </div>
      <div class="funnel-indicator" id="funnelIndicator">
        <div class="funnel-step"></div>
        <div class="funnel-step"></div>
        <div class="funnel-step"></div>
        <div class="funnel-step"></div>
      </div>
      <div class="funnel-label" id="funnelLabel"></div>
    </div>
    <div class="brdg-balance">
      <div class="brdg-icon">B</div>
      <span id="portalBrdg">-- BRDG</span>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon">📁</div><div class="stat-value" id="statProjects">--</div><div class="stat-label">Active Projects</div></div>
    <div class="stat-card"><div class="stat-icon">📄</div><div class="stat-value" id="statInvoices">--</div><div class="stat-label">Pending Invoices</div></div>
    <div class="stat-card"><div class="stat-icon">🎫</div><div class="stat-value" id="statTickets">--</div><div class="stat-label">Open Tickets</div></div>
    <div class="stat-card"><div class="stat-icon">💎</div><div class="stat-value" id="statBrdg">--</div><div class="stat-label">BRDG Balance</div></div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <a href="/invoicing" class="action-btn">Create Invoice</a>
    <a href="/crm" class="action-btn">View CRM</a>
    <a href="/marketplace" class="action-btn">Post a Job</a>
    <a href="/tickets" class="action-btn">Get Support</a>
  </div>

  <!-- Projects -->
  <div class="section-header">
    <div class="section-title">Your Projects</div>
    <a href="/wizard" style="font-size:.8rem;font-weight:600">+ New Project</a>
  </div>
  <div class="projects-grid" id="projectsGrid">
    <div class="empty-state">Loading projects...</div>
  </div>

  <!-- Activity Feed -->
  <div class="section-header">
    <div class="section-title">Recent Activity</div>
  </div>
  <div class="activity-feed" id="activityFeed">
    <div class="empty-state">Loading activity...</div>
  </div>
</div>

<!-- Newsletter Modal -->
<div class="modal-overlay" id="newsletterModal">
  <div class="modal-box">
    <div class="modal-title">Stay in the loop</div>
    <div class="modal-desc">We only send 4 updates a year!</div>
    <input type="email" class="modal-input" id="newsletterEmail" placeholder="your@email.com">
    <button class="modal-btn" onclick="subscribeNewsletter()">Subscribe</button>
    <button class="modal-dismiss" onclick="dismissNewsletter()">No thanks</button>
    <div class="modal-msg" id="newsletterMsg"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  let user = null;
  let token = null;

  function getToken() {
    var match = document.cookie.split(';').map(function(c){return c.trim()}).find(function(c){return c.startsWith('bridge_token=')});
    return match ? match.split('=')[1] : localStorage.getItem('bridge_token');
  }

  function relativeTime(dateStr) {
    if (!dateStr) return '';
    var diff = Date.now() - new Date(dateStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + ' hour' + (hrs > 1 ? 's' : '') + ' ago';
    var days = Math.floor(hrs / 24);
    if (days === 1) return 'Yesterday';
    return days + ' days ago';
  }

  var FUNNEL_STAGES = ['visitor', 'activated', 'converting', 'customer'];

  function setFunnel(stage) {
    var idx = FUNNEL_STAGES.indexOf(stage);
    if (idx < 0) idx = 0;
    var steps = document.querySelectorAll('.funnel-step');
    steps.forEach(function(s, i) { s.classList.toggle('active', i <= idx); });
    document.getElementById('funnelLabel').textContent = (stage || 'visitor').charAt(0).toUpperCase() + (stage || 'visitor').slice(1);
  }

  async function init() {
    token = getToken();

    // Auth check
    try {
      var res = await fetch('/auth/me', { credentials: 'include', headers: token ? { Authorization: 'Bearer ' + token } : {} });
      var data = await res.json();
      if (!data.ok || !data.user) { window.location.href = '/join?next=/portal'; return; }
      user = data.user;
    } catch(e) {
      window.location.href = '/join?next=/portal';
      return;
    }

    // Personalization
    var firstName = (user.name || user.email.split('@')[0] || '').split(' ')[0];
    document.getElementById('welcomeHeading').textContent = 'Welcome back, ' + firstName;
    var plan = user.plan || 'free';
    var badge = document.getElementById('portalPlanBadge');
    badge.textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
    badge.className = 'plan-badge plan-' + plan;
    document.getElementById('portalEmail').textContent = user.email || '';
    document.getElementById('portalBrdg').textContent = (user.brdg_balance || 0).toLocaleString() + ' BRDG';
    document.getElementById('statBrdg').textContent = user.brdg_balance || 0;
    setFunnel(user.funnel_stage);

    // Load data in parallel
    Promise.all([
      loadProjects(),
      loadInvoiceStats(),
      loadTickets(),
      loadActivity()
    ]);

    // Newsletter popup
    checkNewsletter();
  }

  async function loadProjects() {
    try {
      var res = await fetch('/api/platform/projects', { headers: { Authorization: 'Bearer ' + token } });
      var data = await res.json();
      var projects = data.projects || [];
      document.getElementById('statProjects').textContent = projects.filter(function(p){return p.status === 'active'}).length;

      var grid = document.getElementById('projectsGrid');
      grid.innerHTML = '';

      if (projects.length === 0) {
        grid.innerHTML = '<div class="project-card new-project-card" onclick="location.href=\'/wizard\'"><div class="new-icon">+</div><div style="font-size:.82rem;color:var(--dim)">Create your first project</div></div>';
        return;
      }

      projects.slice(0, 6).forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'project-card';
        var statusClass = 'status-' + (p.status || 'active');
        card.innerHTML = '<div class="project-name">' + (p.name || 'Untitled') + '</div><div class="project-meta">' + (p.tool_id || 'No tool') + ' &middot; Last run: ' + relativeTime(p.updated_at) + '</div><span class="project-status ' + statusClass + '">' + (p.status || 'active') + '</span><div class="project-actions"><button class="project-btn project-btn-run" onclick="location.href=\'/projects?run=' + p.id + '\'">Run</button><button class="project-btn" onclick="location.href=\'/projects#' + p.id + '\'">Details</button></div>';
        grid.appendChild(card);
      });

      // New project card
      var newCard = document.createElement('div');
      newCard.className = 'project-card new-project-card';
      newCard.onclick = function() { location.href = '/wizard'; };
      newCard.innerHTML = '<div class="new-icon">+</div><div style="font-size:.82rem;color:var(--dim)">New Project</div>';
      grid.appendChild(newCard);
    } catch(e) {
      document.getElementById('projectsGrid').innerHTML = '<div class="empty-state">Unable to load projects</div>';
    }
  }

  async function loadInvoiceStats() {
    try {
      var res = await fetch('/api/invoices/stats', { headers: { Authorization: 'Bearer ' + token } });
      var data = await res.json();
      var byStatus = data.by_status || {};
      var pending = (byStatus.sent || 0) + (byStatus.overdue || 0);
      document.getElementById('statInvoices').textContent = pending;
    } catch(e) {
      document.getElementById('statInvoices').textContent = '--';
    }
  }

  async function loadTickets() {
    try {
      var res = await fetch('/api/tickets', { headers: { Authorization: 'Bearer ' + token } });
      var data = await res.json();
      var tickets = Array.isArray(data) ? data : (data.tickets || []);
      var open = tickets.filter(function(t) { return t.status !== 'closed'; }).length;
      document.getElementById('statTickets').textContent = open;
    } catch(e) {
      document.getElementById('statTickets').textContent = '--';
    }
  }

  async function loadActivity() {
    var feed = document.getElementById('activityFeed');
    try {
      var res = await fetch('/api/platform/profile/state', { headers: { Authorization: 'Bearer ' + token } });
      var data = await res.json();
      var analytics = data.analytics || {};
      var events = analytics.recent_events || analytics.activity || [];

      feed.innerHTML = '';
      if (events.length === 0) {
        feed.innerHTML = '<div class="empty-state">No recent activity</div>';
        return;
      }

      events.slice(0, 8).forEach(function(ev) {
        var dotClass = 'activity-dot-project';
        if (ev.type === 'invoice' || ev.type === 'payment') dotClass = 'activity-dot-invoice';
        else if (ev.type === 'ticket') dotClass = 'activity-dot-ticket';
        else if (ev.type === 'login' || ev.type === 'auth') dotClass = 'activity-dot-login';

        var item = document.createElement('div');
        item.className = 'activity-item';
        item.innerHTML = '<div class="activity-dot ' + dotClass + '"></div><div class="activity-content"><div class="activity-text">' + (ev.description || ev.message || ev.type || 'Event') + '</div><div class="activity-time">' + relativeTime(ev.created_at || ev.timestamp) + '</div></div>';
        feed.appendChild(item);
      });
    } catch(e) {
      feed.innerHTML = '<div class="empty-state">Unable to load activity</div>';
    }
  }

  function checkNewsletter() {
    if (localStorage.getItem('bridge_newsletter_dismissed')) return;
    if (localStorage.getItem('bridge_newsletter_subscribed')) return;
    setTimeout(function() {
      document.getElementById('newsletterModal').classList.add('show');
      if (user && user.email) {
        document.getElementById('newsletterEmail').value = user.email;
      }
    }, 3000);
  }

  window.subscribeNewsletter = async function() {
    var email = document.getElementById('newsletterEmail').value.trim();
    var msg = document.getElementById('newsletterMsg');
    if (!email || email.indexOf('@') < 0) { msg.textContent = 'Enter a valid email'; msg.style.color = 'var(--red)'; return; }
    try {
      var res = await fetch('/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) });
      var data = await res.json();
      if (data.ok) {
        msg.style.color = 'var(--green)';
        msg.textContent = 'Subscribed! Thanks.';
        localStorage.setItem('bridge_newsletter_subscribed', '1');
        setTimeout(function() { document.getElementById('newsletterModal').classList.remove('show'); }, 1500);
      } else {
        msg.style.color = 'var(--red)';
        msg.textContent = data.error || 'Error subscribing';
      }
    } catch(e) { msg.style.color = 'var(--red)'; msg.textContent = 'Network error'; }
  };

  window.dismissNewsletter = function() {
    localStorage.setItem('bridge_newsletter_dismissed', '1');
    document.getElementById('newsletterModal').classList.remove('show');
  };

  init();
})();
</script>
<script src="/bridge-nav.js" defer></script>
</body>
</html>
