<!DOCTYPE html>
<html>
<head>
  <title>AI-OS REALTIME</title>
  <style>
    body { background:#020617;color:#22d3ee;font-family:monospace;padding:20px }
    .box { padding:10px;margin:10px;border:1px solid #0891b2 }
  </style>
</head>
<body>

<h1>AI-OS REALTIME (NO POLLING)</h1>

<div id="alerts"></div>

<script>
const ws = new WebSocket("ws://localhost:7777");

ws.onmessage = (e) => {
  const d = JSON.parse(e.data);

  if (d.alert) {
    const el = document.createElement("div");
    el.className = "box";
    el.innerText = `[${d.ts}] ${d.alert.toUpperCase()} ? ${d.url}`;
    document.getElementById("alerts").prepend(el);
  }
};
</script>

</body>
</html>
