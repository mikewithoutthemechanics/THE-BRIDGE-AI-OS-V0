<!DOCTYPE html>
<html>
<head>
  <title>AI-OS REALTIME</title>
  <style>
    body { background:#020617;color:#22d3ee;font-family:monospace;padding:20px }
    .box { padding:10px;margin:10px;border:1px solid #0891b2 }
  </style>
</head>
<body>

<h1>AI-OS REALTIME (NO POLLING)</h1>

<div id="alerts"></div>

<script>
// Build a WebSocket URL from the current origin so the same HTML works from
// prod (wss://go.ai-os.co.za/ws), staging, and local dev without edits.
const _wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(_wsProto + "//" + window.location.host + "/ws");

ws.onmessage = (e) => {
  const d = JSON.parse(e.data);

  if (d.alert) {
    const el = document.createElement("div");
    el.className = "box";
    el.innerText = `[${d.ts}] ${d.alert.toUpperCase()} ? ${d.url}`;
    document.getElementById("alerts").prepend(el);
  }
};
</script>

</body>
</html>
