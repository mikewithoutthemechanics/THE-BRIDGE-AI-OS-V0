<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0099ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.6" />
    </radialGradient>

    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </linearGradient>

    <!-- Filters for glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGradient)" rx="10" />

  <!-- Background particles (static) -->
  <circle cx="100" cy="80" r="2" fill="#00ff88" opacity="0.6" />
  <circle cx="300" cy="60" r="1.5" fill="#0099ff" opacity="0.5" />
  <circle cx="600" cy="120" r="2.5" fill="#00ff88" opacity="0.7" />
  <circle cx="150" cy="150" r="1.8" fill="#0099ff" opacity="0.4" />
  <circle cx="700" cy="90" r="2.2" fill="#00ff88" opacity="0.5" />

  <!-- Main Logo Text -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
    BRIDGE AI OS
  </text>

  <!-- Subtitle -->
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0">
    v0 → ∞ Production Operational
  </text>

  <!-- Agent Network Visualization -->
  <!-- Central Brain Node -->
  <circle cx="400" cy="120" r="12" fill="url(#nodeGradient)" filter="url(#glow)" stroke="#00ff88" stroke-width="2" />

  <!-- Surrounding Agent Nodes -->
  <circle cx="250" cy="100" r="10" fill="#00ff88" opacity="0.9" stroke="#00ff88" stroke-width="2" />
  <circle cx="550" cy="100" r="10" fill="#0099ff" opacity="0.9" stroke="#0099ff" stroke-width="2" />
  <circle cx="325" cy="160" r="8" fill="#00ff88" opacity="0.8" stroke="#00ff88" stroke-width="2" />
  <circle cx="475" cy="160" r="8" fill="#0099ff" opacity="0.8" stroke="#0099ff" stroke-width="2" />

  <!-- Connection Lines -->
  <g stroke="#00ff88" stroke-width="3" fill="none" opacity="0.8">
    <!-- Central connections -->
    <line x1="400" y1="120" x2="250" y2="100" stroke="#00ff88" />
    <line x1="400" y1="120" x2="550" y2="100" stroke="#0099ff" />
    <line x1="400" y1="120" x2="325" y2="160" stroke="#00ff88" />
    <line x1="400" y1="120" x2="475" y2="160" stroke="#0099ff" />

    <!-- Inter-agent connections -->
    <line x1="250" y1="100" x2="325" y2="160" stroke="#00ff88" stroke-dasharray="8,4" />
    <line x1="550" y1="100" x2="475" y2="160" stroke="#0099ff" stroke-dasharray="8,4" />
  </g>

  <!-- Data Flow Indicators -->
  <polygon points="325,130 335,125 335,135" fill="#00ff88" opacity="0.9" />
  <polygon points="475,130 485,125 485,135" fill="#0099ff" opacity="0.9" />

  <!-- Agent Labels -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ff88">OSINT</text>
  <text x="550" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0099ff">BILLING</text>
  <text x="325" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ff88">AUTH</text>
  <text x="475" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0099ff">SVG</text>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🧠 BRAIN</text>

  <!-- Status Indicators -->
  <circle cx="720" cy="35" r="6" fill="#00ff88" stroke="#00ff88" stroke-width="2" />
  <text x="735" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ff88">● OPERATIONAL</text>

  <!-- Orbital Elements -->
  <g transform="translate(150,120)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="-12" r="3" fill="#0099ff" opacity="0.8" />
  </g>

  <g transform="translate(650,120)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#0099ff" stroke-width="1" opacity="0.4" />
    <circle cx="12" cy="0" r="3" fill="#00ff88" opacity="0.8" />
  </g>

  <!-- Data flow visualization -->
  <path d="M 50 180 Q 200 160 400 180 T 750 180" stroke="url(#flowGradient)" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Tech Stack Icons (represented as circles) -->
  <g opacity="0.7">
    <circle cx="80" cy="170" r="4" fill="#61dafb" title="React" />
    <circle cx="100" cy="170" r="4" fill="#68c847" title="Node.js" />
    <circle cx="120" cy="170" r="4" fill="#306998" title="Python" />
    <circle cx="140" cy="170" r="4" fill="#336791" title="PostgreSQL" />
  </g>

  <!-- System Status Bar -->
  <rect x="50" y="185" width="700" height="4" fill="#333" rx="2" />
  <rect x="50" y="185" width="560" height="4" fill="#00ff88" rx="2" />
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="10" fill="#a0a0a0">System Load: 80%</text>
</svg>