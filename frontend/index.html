<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Task Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: 1rem;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        input, select, textarea {
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .task-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .task-type-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .task-type-btn.active {
            background: #667eea;
            color: white;
        }

        .task-type-btn:hover {
            background: #667eea;
            color: white;
        }

        .submit-btn {
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .result pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.9rem;
        }

        .status {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bridge Task Runner</h1>

        <form id="taskForm" class="task-form">
            <div class="form-group">
                <label for="taskType">Task Type</label>
                <div class="task-types">
                    <button type="button" class="task-type-btn active" data-type="echo">Echo Task</button>
                    <button type="button" class="task-type-btn" data-type="math">Math Task</button>
                    <button type="button" class="task-type-btn" data-type="general">General Task</button>
                </div>
            </div>

            <div id="echoFields" class="form-group">
                <label for="message">Message</label>
                <input type="text" id="message" placeholder="Enter a message to echo back">
            </div>

            <div id="mathFields" class="form-group" style="display: none;">
                <label for="operation">Operation</label>
                <select id="operation">
                    <option value="add">Add</option>
                    <option value="multiply">Multiply</option>
                </select>
                <label for="a">Number A</label>
                <input type="number" id="a" placeholder="0">
                <label for="b">Number B</label>
                <input type="number" id="b" placeholder="0">
            </div>

            <div id="generalFields" class="form-group" style="display: none;">
                <label for="taskData">Task Data (JSON)</label>
                <textarea id="taskData" placeholder='{"key": "value", "data": "example"}'></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitText">Run Task</span>
            </button>
        </form>

        <div id="status" class="status"></div>

        <div id="result" class="result">
            <h3>Task Result</h3>
            <pre id="resultContent"></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskTypeButtons = document.querySelectorAll('.task-type-btn');
            const echoFields = document.getElementById('echoFields');
            const mathFields = document.getElementById('mathFields');
            const generalFields = document.getElementById('generalFields');
            const form = document.getElementById('taskForm');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');

            // Task type selection
            taskTypeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    taskTypeButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    const taskType = this.dataset.type;
                    echoFields.style.display = taskType === 'echo' ? 'block' : 'none';
                    mathFields.style.display = taskType === 'math' ? 'block' : 'none';
                    generalFields.style.display = taskType === 'general' ? 'block' : 'none';
                });
            });

            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const activeType = document.querySelector('.task-type-btn.active').dataset.type;
                let taskData = {};

                if (activeType === 'echo') {
                    taskData = {
                        task_type: 'echo',
                        task_id: Date.now().toString(),
                        message: document.getElementById('message').value
                    };
                } else if (activeType === 'math') {
                    taskData = {
                        task_type: 'math',
                        task_id: Date.now().toString(),
                        operation: document.getElementById('operation').value,
                        a: parseFloat(document.getElementById('a').value) || 0,
                        b: parseFloat(document.getElementById('b').value) || 0
                    };
                } else if (activeType === 'general') {
                    try {
                        const jsonData = document.getElementById('taskData').value;
                        taskData = jsonData ? JSON.parse(jsonData) : {};
                        taskData.task_type = taskData.task_type || 'general';
                        taskData.task_id = taskData.task_id || Date.now().toString();
                    } catch (err) {
                        showStatus('Invalid JSON format', 'error');
                        return;
                    }
                }

                // Show loading state
                submitBtn.disabled = true;
                submitText.innerHTML = '<div class="loading"></div> Running...';

                try {
                    const response = await fetch('http://localhost:8080/run-task', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(taskData)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showStatus('Task completed successfully!', 'success');
                        resultContent.textContent = JSON.stringify(data, null, 2);
                        result.classList.add('show');
                    } else {
                        showStatus(`Task failed: ${data.detail || 'Unknown error'}`, 'error');
                        result.classList.remove('show');
                    }
                } catch (error) {
                    showStatus(`Network error: ${error.message}`, 'error');
                    result.classList.remove('show');
                } finally {
                    submitBtn.disabled = false;
                    submitText.textContent = 'Run Task';
                }
            });

            function showStatus(message, type) {
                status.textContent = message;
                status.className = `status ${type} show`;
                setTimeout(() => {
                    status.classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
