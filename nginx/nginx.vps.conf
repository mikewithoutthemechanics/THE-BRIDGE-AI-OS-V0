# Bridge AI OS — VPS: static UI + reverse proxy to bridge-api
# Mounted as /etc/nginx/conf.d/default.conf in Dockerfile.frontend

upstream bridge_api {
    server bridge-api:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://bridge_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future API surface (launch.js can grow routes here)
    location /api/ {
        proxy_pass http://bridge_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
