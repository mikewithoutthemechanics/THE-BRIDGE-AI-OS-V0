version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      - PYTHONPATH=/app
      - DEMO_MODE=true
      - NETWORK_MODE=offline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bridge-network

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - bridge-network

  # =============================================================================
  # OSINT STACK SERVICES
  # =============================================================================

  consent-ledger:
    image: postgres:15-alpine
    container_name: consentvault-consent-ledger
    environment:
      POSTGRES_DB: consent_ledger
      POSTGRES_USER: consent_user
      POSTGRES_PASSWORD: ${CONSENT_DB_PASSWORD:-changeme}
    volumes:
      - consent-data:/var/lib/postgresql/data
      - ./consent-osint-stack/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - bridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "consent_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  consent-api:
    build:
      context: ./consent-osint-stack/consent-api
      dockerfile: Dockerfile
    container_name: consentvault-consent-api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
      JWT_SECRET: ${JWT_SECRET:-changeme}
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
    volumes:
      - ./consent-osint-stack/consent-api:/app
    networks:
      - bridge-network
    depends_on:
      consent-ledger:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1770

  databunker:
    image: securecodebox/databunker:latest
    container_name: consentvault-databunker
    environment:
      DATABUNKER_STORAGE: sqlite
      DATABUNKER_SQLITE_PATH: /opt/databunker/databunker.db
      DATABUNKER_ADMIN_TOKEN: ${DATABUNKER_TOKEN:-changeme}
      DATABUNKER_ENCRYPTION_KEY: ${DATABUNKER_ENCRYPTION_KEY:-changeme}
      DATABUNKER_AUDIT_ENABLED: "true"
    volumes:
      - databunker-data:/opt/databunker
    networks:
      - bridge-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  osint-orchestrator:
    build:
      context: ./consent-osint-stack/osint-orchestrator
      dockerfile: Dockerfile
    container_name: consentvault-osint-orchestrator
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: postgresql://consent_user:${CONSENT_DB_PASSWORD:-changeme}@consent-ledger:5432/consent_ledger
      DATABUNKER_URL: http://databunker:3000
      DATABUNKER_TOKEN: ${DATABUNKER_TOKEN:-changeme}
      DEMO_MODE: ${DEMO_MODE:-true}
      NETWORK_MODE: ${NETWORK_MODE:-offline}
    volumes:
      - osint-data:/app/data
      - osint-synthetic:/app/synthetic
    networks:
      - bridge-network
    depends_on:
      - consent-ledger
      - databunker
    restart: unless-stopped

  # Demo OSINT Tools
  sherlock-osint:
    build:
      context: ./consent-osint-stack/osint-tools/sherlock
      dockerfile: Dockerfile
    container_name: consentvault-sherlock
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - osint-data:/app/data
    networks:
      - bridge-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  maigret-osint:
    build:
      context: ./consent-osint-stack/osint-tools/maigret
      dockerfile: Dockerfile
    container_name: consentvault-maigret
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - osint-data:/app/data
    networks:
      - bridge-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  consent-data:
  databunker-data:
  osint-data:
  osint-synthetic:

networks:
  bridge-network:
    driver: bridge
