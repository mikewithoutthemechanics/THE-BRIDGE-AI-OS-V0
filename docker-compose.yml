version: "3.9"

services:
  overseer:
    build: ./overseer
    container_name: bridge-overseer
    environment:
      OVERSEER_ENABLED: "true"
      OVERSEER_INTERVAL: "2.0"
      OVERSEER_STATE_PATH: "/var/lib/bridge/state.json"
      OVERSEER_LOG_PATH: "/var/log/bridge/overseer.log"
      OVERSEER_PERSONA: "oracle"
    volumes:
      - bridge_data:/var/lib/bridge
      - bridge_logs:/var/log/bridge
      - ./:/app:ro
    ports:
      - "9091:9091"
    networks:
      - bridge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bridge-backend
    environment:
      DEMO_MODE: "true"
      ALLOWED_ORIGINS: "http://localhost:3000"
      RATE_LIMIT: "100"
    volumes:
      - ./backend:/app
      - bridge_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - bridge
    depends_on:
      overseer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bridge-frontend
    ports:
      - "3000:80"
    networks:
      - bridge
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  bridge_data:
    name: bridge_overseer_data
  bridge_logs:
    name: bridge_overseer_logs

networks:
  bridge:
    name: bridge_network
    driver: bridge