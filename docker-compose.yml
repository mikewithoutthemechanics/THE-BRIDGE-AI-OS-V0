version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bridge-network

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - bridge-network

networks:
  bridge-network:
    driver: bridge
