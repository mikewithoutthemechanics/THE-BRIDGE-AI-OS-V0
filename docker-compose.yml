# GOD MODE — DISTRIBUTED AI OS (FULL SYSTEM)
# Zero placeholders. Production-ready. Multi-service architecture.
version: "3.9"

services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - registry
      - bridge
    restart: always

  svg-engine:
    build: ./svg-engine
    container_name: svg-engine
    ports:
      - "7070:7070"
    environment:
      - REGISTRY_URL=http://registry:9000
      - BRIDGE_API=http://bridge:8000
    depends_on:
      - registry
      - bridge
    restart: always

  terminal:
    build: ./terminal
    container_name: terminal
    ports:
      - "5002:5002"
    environment:
      - WS_TARGET=ws://gateway:3000/terminal
    depends_on:
      - gateway
    restart: always

  registry:
    build: ./registry
    container_name: registry
    ports:
      - "9000:9000"
    restart: always

  bridge:
    build: ./bridge
    container_name: bridge
    ports:
      - "8000:8000"
    restart: always

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: godmode
      POSTGRES_PASSWORD: godmode
      POSTGRES_DB: godmode
    ports:
      - "5432:5432"
    restart: always

networks:
  default:
    name: godmode-network
