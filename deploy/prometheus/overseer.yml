global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bridge-ai'
    environment: 'production'

# Scrape configurations
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'overseer'
    static_configs:
      - targets: ['overseer:9091']
        labels:
          service: 'overseer'
          component: 'governor'

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'

  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:80']
        labels:
          service: 'frontend'
          component: 'ui'

  - job_name: 'overseer-events'
    static_configs:
      - targets: ['overseer-events:9092']
        labels:
          service: 'overseer-events'
          component: 'event-ingest'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "/etc/prometheus/*.yml"
