# Bridge AI OS - Nginx Reverse Proxy Configuration
# Serves all 11 public domains from single VPS

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=bridge_ai:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Upstream backends
    upstream bridge_ai_os_backend {
        server bridge-ai-os:8080;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ============================================================================
    # BRIDGE AI OS - PRIMARY DOMAINS
    # ============================================================================

    server {
        listen 80;
        server_name ai-os.co.za www.ai-os.co.za;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ai-os.co.za www.ai-os.co.za;

        ssl_certificate /etc/nginx/ssl/ai-os.co.za.crt;
        ssl_certificate_key /etc/nginx/ssl/ai-os.co.za.key;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Root domain serves Bridge AI OS
        location / {
            proxy_pass http://bridge_ai_os_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting for web interface
            limit_req zone=bridge_ai burst=20 nodelay;
        }

        # API endpoints with higher rate limits
        location /api/ {
            proxy_pass http://bridge_ai_os_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Higher rate limit for APIs
            limit_req zone=api burst=100 nodelay;
        }

        # Integrated monitoring dashboard
        location /monitoring {
            alias /opt/monitoring/dashboard;
            index monitoring.html;
            try_files $uri $uri/ /monitoring/monitoring.html;

            # Basic auth for monitoring access
            auth_basic "Bridge AI OS Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Allow CORS for monitoring API calls
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        # Integrated monitoring dashboard
        location /monitoring {
            alias /opt/monitoring/dashboard;
            index monitoring.html;
            try_files $uri $uri/ /monitoring/monitoring.html;

            # Basic auth for monitoring access
            auth_basic "Bridge AI OS Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Allow CORS for monitoring API calls
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }
    }

    # ============================================================================
    # BRIDGE-AI-OS.COM
    # ============================================================================

    server {
