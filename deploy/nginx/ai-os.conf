# =============================================================================
# Bridge AI OS — Nginx site config
# Path:   /etc/nginx/sites-available/ai-os
# Symlink: sudo ln -s /etc/nginx/sites-available/ai-os /etc/nginx/sites-enabled/
#
# Apply:
#   sudo nginx -t
#   sudo systemctl restart nginx
# =============================================================================

server {
    listen 80;
    server_name go.ai-os.co.za;

    # Document root — static files served from here
    root /var/www/ai-os;
    index index.html;

    # ── Main routing ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Admin route redirects (prevents 404 on /admin and /admin/dashboard) ──
    location = /admin/dashboard {
        return 301 /admin.html;
    }

    location = /admin {
        return 301 /admin.html;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    location ~* \.(html|js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── API backend proxy ──────────────────────────────────────────────────────
    # Adjust the upstream port if the Node process runs on a different port.
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 /502.html;
    location = /502.html {
        root /var/www/errors;
    }
}
