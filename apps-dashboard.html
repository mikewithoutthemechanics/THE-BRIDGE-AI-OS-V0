<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge AI OS - Apps & APIs Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00ff88;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.2em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .app-card {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }

        .app-card.online {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .app-card.offline {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .app-card.degraded {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.05);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            margin-right: 15px;
        }

        .app-info {
            flex: 1;
        }

        .app-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .app-url {
            color: #a0a0a0;
            font-size: 0.9em;
            word-break: break-all;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online { background: #00ff88; }
        .status-dot.offline { background: #ff4444; }
        .status-dot.degraded { background: #ffaa00; }

        .status-text {
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-text.online { color: #00ff88; }
        .status-text.offline { color: #ff4444; }
        .status-text.degraded { color: #ffaa00; }

        .app-details {
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .detail-label {
            color: #a0a0a0;
        }

        .detail-value {
            color: #ffffff;
            font-weight: bold;
        }

        .response-time {
            color: #00ff88;
        }

        .uptime {
            color: #0099ff;
        }

        .app-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: rgba(0, 153, 255, 0.1);
            border: 1px solid rgba(0, 153, 255, 0.3);
            color: #0099ff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 153, 255, 0.2);
        }

        .action-btn.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
        }

        .action-btn.danger:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #a0a0a0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
        }

        .filter-btn:hover {
            border-color: #0099ff;
            color: #0099ff;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00ff88;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Apps & APIs Dashboard</h1>
            <p>Monitor 50+ Bridge AI OS services and external APIs</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalApps">50</div>
                <div class="stat-label">Total Apps</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="onlineApps">47</div>
                <div class="stat-label">Online</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="offlineApps">2</div>
                <div class="stat-label">Offline</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="degradedApps">1</div>
                <div class="stat-label">Degraded</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avgResponse">42ms</div>
                <div class="stat-label">Avg Response</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Services</button>
            <button class="filter-btn" data-filter="online">Online Only</button>
            <button class="filter-btn" data-filter="offline">Offline Only</button>
            <button class="filter-btn" data-filter="degraded">Degraded Only</button>
            <button class="filter-btn" data-filter="core">Core Services</button>
            <button class="filter-btn" data-filter="external">External APIs</button>
        </div>

        <div class="apps-grid" id="appsGrid">
            <!-- Apps will be dynamically generated here -->
        </div>
    </div>

    <script>
        // Bridge AI OS Apps & APIs Dashboard
        class AppsDashboard {
            constructor() {
                this.apps = this.generateAppsData();
                this.currentFilter = 'all';
                this.updateInterval = null;
                this.init();
            }

            generateAppsData() {
                const categories = ['core', 'external', 'internal', 'ai', 'blockchain'];
                const statuses = ['online', 'offline', 'degraded'];

                const apps = [];

                // Core Bridge AI OS services
                const coreServices = [
                    { name: 'Bridge AI Gateway', url: 'https://bridge-ai-os.com/api/health', category: 'core' },
                    { name: 'AI Brain Engine', url: 'https://brain.bridge-ai-os.com/health', category: 'ai' },
                    { name: 'SVG Skill Engine', url: 'https://svg.bridge-ai-os.com/status', category: 'core' },
                    { name: 'Digital Twin API', url: 'https://live.bridge-ai-os.com/twin/status', category: 'ai' },
                    { name: 'GOD MODE Topology', url: 'https://god.bridge-ai-os.com/topology', category: 'core' },
                    { name: 'Revenue Engine', url: 'https://api.bridge-ai-os.com/revenue/status', category: 'core' },
                    { name: 'Billing Service', url: 'https://billing.bridge-ai-os.com/health', category: 'core' },
                    { name: 'Agent Registry', url: 'https://registry.bridge-ai-os.com/status', category: 'core' },
                    { name: 'Crypto Wallet API', url: 'https://wallet.bridge-ai-os.com/status', category: 'blockchain' },
                    { name: 'Supabase Database', url: 'https://supabase.bridge-ai-os.com/health', category: 'internal' }
                ];

                // External APIs and services
                const externalServices = [
                    { name: 'OpenAI API', url: 'https://api.openai.com/v1/models', category: 'external' },
                    { name: 'Anthropic Claude', url: 'https://api.anthropic.com/v1/messages', category: 'external' },
                    { name: 'Stripe Payments', url: 'https://api.stripe.com/v1/charges', category: 'external' },
                    { name: 'GitHub API', url: 'https://api.github.com/user', category: 'external' },
                    { name: 'Supabase Client', url: 'https://supabase.com/api/rest/v1/', category: 'external' },
                    { name: 'Cloudflare API', url: 'https://api.cloudflare.com/client/v4/zones', category: 'external' },
                    { name: 'Redis Cache', url: 'redis://localhost:6379', category: 'internal' },
                    { name: 'PostgreSQL DB', url: 'postgresql://localhost:5432', category: 'internal' },
                    { name: 'Docker Registry', url: 'https://registry.docker.io/v2/', category: 'external' },
                    { name: 'NPM Registry', url: 'https://registry.npmjs.org/', category: 'external' },
                    { name: 'PyPI Registry', url: 'https://pypi.org/', category: 'external' },
                    { name: 'Ethereum RPC', url: 'https://mainnet.infura.io/v3/', category: 'blockchain' },
                    { name: 'Polygon RPC', url: 'https://polygon-rpc.com/', category: 'blockchain' },
                    { name: 'IPFS Gateway', url: 'https://ipfs.io/api/v0/version', category: 'external' },
                    { name: 'Web3 Storage', url: 'https://api.web3.storage/', category: 'external' }
                ];

                // Generate remaining apps to reach 50
                const allServices = [...coreServices, ...externalServices];

                // Add more generated services
                const serviceTypes = ['API', 'Service', 'Engine', 'Gateway', 'Processor', 'Handler', 'Manager', 'Controller'];
                const domains = ['bridge-ai-os.com', 'api.bridge-ai-os.com', 'internal.bridge-ai-os.com'];

                for (let i = allServices.length; i < 50; i++) {
                    const type = serviceTypes[Math.floor(Math.random() * serviceTypes.length)];
                    const domain = domains[Math.floor(Math.random() * domains.length)];
                    const category = categories[Math.floor(Math.random() * categories.length)];

                    allServices.push({
                        name: `AI ${type} ${i + 1}`,
                        url: `https://${domain}/${type.toLowerCase()}/${i + 1}`,
                        category: category
                    });
                }

                // Assign random statuses and metrics
                return allServices.map((app, index) => ({
                    id: index + 1,
                    ...app,
                    status: this.getRandomStatus(),
                    responseTime: Math.floor(Math.random() * 200) + 10,
                    uptime: Math.floor(Math.random() * 20) + 80,
                    lastChecked: Date.now() - Math.floor(Math.random() * 300000),
                    version: `v${Math.floor(Math.random() * 3) + 1}.${Math.floor(Math.random() * 10)}.${Math.floor(Math.random() * 20)}`
                }));
            }

            getRandomStatus() {
                const rand = Math.random();
                if (rand < 0.85) return 'online';      // 85% online
                if (rand < 0.95) return 'degraded';    // 10% degraded
                return 'offline';                      // 5% offline
            }

            init() {
                this.renderApps();
                this.setupFilters();
                this.startAutoUpdate();
            }

            renderApps() {
                const grid = document.getElementById('appsGrid');
                const filteredApps = this.getFilteredApps();

                grid.innerHTML = filteredApps.map(app => this.createAppCard(app)).join('');

                this.updateStats();
            }

            createAppCard(app) {
                const iconLetter = app.name.charAt(0);
                const iconColor = this.getIconColor(app.category);

                return `
                    <div class="app-card ${app.status}" data-category="${app.category}">
                        <div class="app-header">
                            <div class="app-icon" style="background: ${iconColor}">${iconLetter}</div>
                            <div class="app-info">
                                <div class="app-name">${app.name}</div>
                                <div class="app-url">${app.url}</div>
                            </div>
                            <div class="status-indicator">
                                <div class="status-dot ${app.status}"></div>
                                <div class="status-text ${app.status}">${app.status.toUpperCase()}</div>
                            </div>
                        </div>

                        <div class="app-details">
                            <div class="detail-row">
                                <span class="detail-label">Response Time:</span>
                                <span class="detail-value response-time">${app.responseTime}ms</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Uptime:</span>
                                <span class="detail-value uptime">${app.uptime}%</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Version:</span>
                                <span class="detail-value">${app.version}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Last Check:</span>
                                <span class="detail-value">${this.formatLastChecked(app.lastChecked)}</span>
                            </div>
                        </div>

                        <div class="app-actions">
                            <button class="action-btn" onclick="checkAppStatus(${app.id})">🔄 Check</button>
                            <button class="action-btn" onclick="viewAppLogs(${app.id})">📋 Logs</button>
                            <button class="action-btn danger" onclick="restartApp(${app.id})">🔄 Restart</button>
                        </div>
                    </div>
                `;
            }

            getIconColor(category) {
                const colors = {
                    core: '#00ff88',
                    external: '#0099ff',
                    internal: '#ffaa00',
                    ai: '#ff6b6b',
                    blockchain: '#aa66ff'
                };
                return colors[category] || '#666666';
            }

            getFilteredApps() {
                if (this.currentFilter === 'all') return this.apps;

                return this.apps.filter(app => {
                    switch (this.currentFilter) {
                        case 'online': return app.status === 'online';
                        case 'offline': return app.status === 'offline';
                        case 'degraded': return app.status === 'degraded';
                        case 'core': return app.category === 'core';
                        case 'external': return app.category === 'external';
                        default: return true;
                    }
                });
            }

            setupFilters() {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentFilter = btn.dataset.filter;
                        this.renderApps();
                    });
                });
            }

            updateStats() {
                const total = this.apps.length;
                const online = this.apps.filter(app => app.status === 'online').length;
                const offline = this.apps.filter(app => app.status === 'offline').length;
                const degraded = this.apps.filter(app => app.status === 'degraded').length;

                const responseTimes = this.apps.filter(app => app.status === 'online').map(app => app.responseTime);
                const avgResponse = responseTimes.length > 0
                    ? Math.round(responseTimes.reduce((a, b) => a + b, 0) / responseTimes.length)
                    : 0;

                document.getElementById('totalApps').textContent = total;
                document.getElementById('onlineApps').textContent = online;
                document.getElementById('offlineApps').textContent = offline;
                document.getElementById('degradedApps').textContent = degraded;
                document.getElementById('avgResponse').textContent = `${avgResponse}ms`;
            }

            formatLastChecked(timestamp) {
                const now = Date.now();
                const diff = now - timestamp;
                const minutes = Math.floor(diff / 60000);

                if (minutes < 1) return 'Just now';
                if (minutes < 60) return `${minutes}m ago`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                return `${days}d ago`;
            }

            startAutoUpdate() {
                // Update status every 30 seconds
                this.updateInterval = setInterval(() => {
                    this.apps.forEach(app => {
                        // Randomly change some statuses (simulate real monitoring)
                        if (Math.random() < 0.1) { // 10% chance to change status
                            app.status = this.getRandomStatus();
                        }
                        app.lastChecked = Date.now();
                        app.responseTime = Math.floor(Math.random() * 200) + 10;
                    });
                    this.renderApps();
                }, 30000);
            }
        }

        // Global action functions
        function checkAppStatus(appId) {
            console.log(`Checking status for app ${appId}`);
            // Simulate API call
            setTimeout(() => {
                alert(`App ${appId} status checked successfully!`);
            }, 1000);
        }

        function viewAppLogs(appId) {
            console.log(`Viewing logs for app ${appId}`);
            window.open(`/logs.html?app=${appId}`, '_blank');
        }

        function restartApp(appId) {
            if (confirm(`Are you sure you want to restart app ${appId}?`)) {
                console.log(`Restarting app ${appId}`);
                // Simulate restart
                setTimeout(() => {
                    alert(`App ${appId} restarted successfully!`);
                }, 2000);
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AppsDashboard();
        });
    </script>
</body>
</html>
